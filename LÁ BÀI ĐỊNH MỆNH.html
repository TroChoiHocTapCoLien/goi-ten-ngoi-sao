     card.classList.add('collision-ejected');
     card.style.transition=`transform ${640+i%4*55}ms cubic-bezier(.17,.68,.36,1),opacity .67s ease-in,filter .67s ease-in`;
     position(card,Math.cos(direction)*dist,Math.sin(direction)*dist,Math.random()*500-250,.22);
     card.style.opacity='0';card.style.filter='brightness(2) blur(12px)';
     if(i%3===0)tone(290+i*13,.08,'triangle',.022);
   });
   arena.classList.remove('collision-impact');
   arena.classList.toggle('final-three',target===3);
   arena.classList.toggle('final-two',target===2);
   arena.classList.toggle('final-one',target===1);
   $('orbitCount').textContent=`✦ CÒN ${target} / ${pool.length} LÁ BÀI ✦`;
   $('stageLabel').textContent=target===3?'✦ BA LÁ BÀI — VÒNG XOÁY ĐỊNH MỆNH ✦':target===2?'✦ HAI LÁ — CUỘC ĐỐI ĐẦU CUỐI ✦':target===1?'✦ LÁ BÀI ĐỊNH MỆNH ĐÃ XUẤT HIỆN ✦':`✦ ${target} LÁ TIẾP TỤC QUAY ✦`;
   if(target<=3){
      const over=$('fateOverlay');if(over){$('fateNumber').textContent=target;over.classList.remove('show');void over.offsetWidth;over.classList.add('show');setTimeout(()=>over.classList.remove('show'),600)}
      tone(target===1?95:160,.45,'sine',.12);
      burst(W*.5,H*.53,85,target===1?'#ffe0a0':'#f36dff');
   }
   await sleep(690);
   spinSpeed=target===1?2.8:target===2?5.5:target===3?6.6:Math.max(7.2,9.5-stageIndex*.28);
 }
 for(let stageIndex=0;stageIndex<milestones.length;stageIndex++){
   const goal=milestones[stageIndex];
   await collideAndEliminate(goal,stageIndex);
   await sleep(goal<=3?(goal===1?950:1150):680);
 }
 if(pool.length===1){$('orbitCount').textContent='✦ LÁ BÀI DUY NHẤT ✦';await sleep(950)}
 spinSpeed=1.5;await sleep(320);spinAlive=false;
 const portal=$('orbitPortal');if(portal)portal.style.transform='translate(-50%,-50%)';

 stopLotteryMusic();await sleep(330);tone(82,.75,'sine',.10);setState('LOCK');$('orbitCount').textContent='✦ LÁ BÀI ĐỊNH MỆNH ✦';
 const chosen=allCards.find(c=>c.dataset.id===winner.id);
 if(chosen){chosen.style.transition='transform 1.15s cubic-bezier(.17,.85,.14,1.15),width .85s,height .85s,filter 1s';chosen.style.zIndex='65';chosen.style.filter='brightness(1.45) drop-shadow(0 0 24px #ffe2a0)';chosen.style.setProperty('--cw',Math.min(175,w*.29)+'px');chosen.style.setProperty('--ch',Math.min(230,w*.39)+'px');position(chosen,0,0,0,1.28)}
 const oc=$('orbitCenter');if(oc)oc.textContent='✧';tone(440,.27,'sine',.065);await sleep(1150);
 arena.insertAdjacentHTML('beforeend','<div class="fate-flash"></div>');burst(W/2,H*.55,160,'#ffe2a0');victory();arena.classList.remove('orbiting','final-three','final-two','final-one');setState('RESULT');
 arena.innerHTML=`<div class="result-card"><div class="tag">✦ LÁ BÀI ĐỊNH MỆNH ✦</div><div style="margin-top:20px"><span class="big-number">✧</span></div><h2>${esc(winner.name)}</h2><p style="font-size:clamp(20px,3vw,32px);font-weight:900;color:#ffe2a0;margin-top:14px">🎉 Mời bạn lên bảng!</p><div class="actions"><button class="btn gold" id="nextCall">✦ GỌI TIẾP ✦</button></div></div>`;
 activeClass().selected.push(winner.id);save();updateControls();$('nextCall').onclick=()=>startDraw();
}










function modal(html){$('modalLayer').innerHTML=`<div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true"><div class="toprow"><h2>${html.title}</h2><button class="btn icon" id="closeModal" aria-label="Đóng">✕</button></div>${html.body}</section></div>`;$('closeModal').onclick=closeModal;$('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()})}function closeModal(){$('modalLayer').innerHTML=''}
function classBlockHTML(name,text,cid){return '<div class="class-block" data-cid="'+(cid||'')+'"><div class="class-block-head"><input class="class-name" placeholder="Tên lớp (vd: 12A1)" value="'+esc(name)+'"><button class="btn icon" data-del title="Xóa lớp này">✕</button></div><textarea rows="6" placeholder="Nguyễn Văn An&#10;Trần Thị Bình">'+esc(text)+'</textarea><div class="class-block-foot"><button class="btn small" data-import>📂 Nhập TXT / CSV</button><input class="block-file" type="file" accept=".txt,.csv,text/plain,text/csv" style="display:none"><span class="class-count"></span></div></div>'}
function openRoster(){modal({title:'👥 Danh sách lớp học',body:`<p>Mỗi khối là một lớp: nhập tên lớp và dán mỗi dòng một học sinh (có thể nhập dạng “01, Nguyễn Văn An”). Bấm “Lưu tất cả” để lưu mọi lớp cùng lúc.</p><div id="classBlocks">${data.classes.map(c=>classBlockHTML(c.name,c.students.map(s=>s.name).join('\n'),c.id)).join('')}</div><div class="actions"><button class="btn" id="addClass">＋ Thêm lớp</button><button class="btn primary" id="saveAllClasses">💾 Lưu tất cả</button><button class="btn" id="loadSample">Dùng danh sách mẫu</button></div><p class="notice">Mẹo: học sinh đã được gọi sẽ không được chọn lại trừ khi bật “Cho phép gọi lại”. Khi lưu lại, học sinh đã gọi được giữ nguyên theo tên trong cùng lớp.</p>`});
const blocksBox=$('classBlocks');
const updateCounts=()=>{blocksBox.querySelectorAll('.class-block').forEach(b=>{const n=b.querySelector('textarea').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).length;b.querySelector('.class-count').textContent=n?('· '+n+' học sinh'):'· chưa có học sinh'})};
blocksBox.addEventListener('input',updateCounts);updateCounts();
blocksBox.addEventListener('click',e=>{const del=e.target.closest('[data-del]');if(del){const b=del.closest('.class-block');if((b.querySelector('.class-name').value.trim()||b.querySelector('textarea').value.trim())&&!confirm('Xóa khối lớp này?'))return;b.remove();updateCounts();return}const imp=e.target.closest('[data-import]');if(imp)imp.closest('.class-block').querySelector('.block-file').click()});
blocksBox.addEventListener('change',async e=>{if(!e.target.classList.contains('block-file'))return;const f=e.target.files[0];if(!f)return;const b=e.target.closest('.class-block');b.querySelector('textarea').value=await f.text();updateCounts();e.target.value=''});
$('addClass').onclick=()=>{blocksBox.insertAdjacentHTML('beforeend',classBlockHTML('','',''));const b=blocksBox.lastElementChild;b.querySelector('.class-name').focus();updateCounts()};
$('loadSample').onclick=()=>{const blocks=[...blocksBox.querySelectorAll('.class-block')];let target=blocks.find(b=>!b.querySelector('textarea').value.trim());if(!target){blocksBox.insertAdjacentHTML('beforeend',classBlockHTML('',sample.join('\n'),''));updateCounts();return}target.querySelector('textarea').value=sample.join('\n');updateCounts()};
$('saveAllClasses').onclick=()=>{
const prevActiveId=data.activeClassId;
const blocks=[...blocksBox.querySelectorAll('.class-block')].map(b=>({cid:b.dataset.cid||'',name:b.querySelector('.class-name').value.trim(),lines:b.querySelector('textarea').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^\s*\d+\s*[.,;:–-]\s*/,''))})).filter(b=>b.lines.length>0);
if(!blocks.length){toast('Cần có ít nhất một lớp có học sinh.');return}
const over=blocks.find(b=>b.lines.length>180);if(over){toast('Lớp '+(over.name||'(chưa đặt tên)')+' vượt quá 180 học sinh.');return}
const used=new Set(blocks.filter(b=>b.name).map(b=>b.name));
blocks.forEach(b=>{if(!b.name){let n=1;while(used.has('Lớp '+n))n++;b.name='Lớp '+n;used.add(b.name)}});
const seen=new Set();for(const b of blocks){if(seen.has(b.name)){toast('Tên lớp bị trùng: "'+b.name+'". Hãy đổi tên rồi lưu lại.');return}seen.add(b.name)}
const oldByName=new Map();data.classes.forEach(c=>{if(!oldByName.has(c.name))oldByName.set(c.name,[]);oldByName.get(c.name).push(c)});
const newClasses=blocks.map(b=>{
const olds=oldByName.get(b.name);const old=olds&&olds.length?olds.shift():null;
const idPool=new Map();if(old)old.students.forEach(s=>{if(!idPool.has(s.name))idPool.set(s.name,[]);idPool.get(s.name).push(s.id)});
const students=b.lines.map(name=>{const q=idPool.get(name);const id=q&&q.length?q.shift():'s'+Date.now()+'-'+Math.random().toString(36).slice(2,8);return{id,name}});
const newIds=new Set(students.map(s=>s.id));
const selected=old?old.selected.filter(id=>newIds.has(id)):[];
return{id:old?old.id:'c'+Date.now()+'-'+Math.random().toString(36).slice(2,8),name:b.name,students,selected}});
const ai=blocks.findIndex(b=>b.cid===prevActiveId);
data.classes=newClasses;data.activeClassId=ai>=0?newClasses[ai].id:newClasses[0].id;
save();closeModal();resetView();
const total=newClasses.reduce((a,c)=>a+c.students.length,0);
toast('Đã lưu '+newClasses.length+' lớp, tổng '+total+' học sinh.')}}
function openSettings(){modal({title:'⚙️ Cài đặt giáo viên',body:`<div class="setting"><label class="check"><input id="repeatStudent" type="checkbox" ${data.repeatStudents?'checked':''}> Cho phép gọi lại học sinh (học sinh đã được gọi vẫn có thể được gọi lại)</label></div><div class="actions"><button class="btn primary" id="saveSettings">💾 Lưu cài đặt</button><button class="btn" id="resetSession">↻ Reset phiên gọi tên</button><button class="btn danger" id="eraseAll">Xóa toàn bộ dữ liệu</button></div><p class="notice">“Reset phiên gọi tên” xóa danh sách học sinh đã được gọi của lớp đang chọn nhưng giữ danh sách lớp.</p>`});$('saveSettings').onclick=()=>{data.repeatStudents=$('repeatStudent').checked;save();closeModal();updateControls();toast('Đã lưu cài đặt.')};$('resetSession').onclick=()=>{if(confirm('Reset lượt gọi tên?')){activeClass().selected=[];save();closeModal();resetView()}};$('eraseAll').onclick=()=>{if(confirm('Xóa TOÀN BỘ dữ liệu đã lưu, bao gồm cả danh sách học sinh?')){data=defaults();save();closeModal();resetView()}}}


function resetView(){stopLotteryMusic();$('arena').classList.remove('orbiting');winner=null;setState('IDLE');$('arena').classList.remove('hidden');setHead('Ai là người được chọn?','Những lá bài đang nắm giữ điều bất ngờ...');let list=shuffle(remaining());layCards(list);$('stageLabel').textContent=remaining().length?'✦ NHỮNG LÁ BÀI ĐANG CHỜ ĐỢI ✦':'✦ TẤT CẢ HỌC SINH ĐÃ ĐƯỢC GỌI ✦';updateControls();refreshClassSelect()}
$('lotteryVolume').value=data.lotteryVolume??55;$('lotteryVolume').oninput=e=>{data.lotteryVolume=Number(e.target.value);uploadedAudio.volume=Number(e.target.value)/100;save()};$('audioFileInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('audio/')&&!/\.(mp3|wav|ogg|m4a)$/i.test(f.name)){toast('Vui lòng chọn tệp âm thanh.');return}setUploadedMusic(f,f.name);await persistMusic(f);toast('Đã tải nhạc: '+f.name)};$('clearAudioBtn').onclick=clearUploadedMusic;restoreMusic();$('spinBtn').onclick=startDraw;$('rosterBtn').onclick=openRoster;$('classSelect').onchange=()=>{data.activeClassId=$('classSelect').value;save();resetView();};$('settingsBtn').onclick=openSettings;$('soundBtn').onclick=()=>{data.sound=!data.sound;if(!data.sound)stopLotteryMusic();save();updateControls();tone(600,.1)};$('fullBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>toast('Trình duyệt không hỗ trợ chế độ toàn màn hình.'))};
window.addEventListener('resize',()=>{if(state==='IDLE')resetView()});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modalLayer').innerHTML)closeModal()});resetView();
</script>
