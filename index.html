function roundRectUFO(ctx, x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function playUfoTone(freq1, freq2, type, duration, vol) {
  if (!S || !S.set || !S.set.sound) return;
  try {
    var actx = window.__audioCtx || (window.__audioCtx = new (window.AudioContext || window.webkitAudioContext)());
    if (actx.state === 'suspended') actx.resume();
    var now = actx.currentTime;
    var osc = actx.createOscillator();
    var gain = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq1, now);
    if (freq2) osc.frequency.exponentialRampToValueAtTime(freq2, now + duration);
    var v = (vol || 0.15);
    gain.gain.setValueAtTime(v, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start(now);
    osc.stop(now + duration);
  } catch(e) {}
}

function buildUFO(P){
  var wrap = $('#ufo'), cv = wrap.querySelector('canvas');
  var W = wrap.clientWidth, H = wrap.clientHeight;
  var x = fitCanvas(cv, W, H);
  var n = Math.max(P.length, 1);

  // Phân bố học sinh đứng trên Sàn Năng Lượng Không Gian (Spaceport Platform)
  var actors = [];
  var isTwoRows = (n > 10);
  var cols = isTwoRows ? Math.ceil(n / 2) : n;
  var spacing = Math.min(115, 1100 / (cols + 1));
  var startX = 640 - ((cols - 1) * spacing) / 2;

  var HAIR_COLS = ['#1f2937', '#111827', '#374151', '#4b5563', '#1e293b'];

  P.forEach(function(name, i){
    var row = isTwoRows ? Math.floor(i / cols) : 0;
    var col = isTwoRows ? (i % cols) : i;
    var curSpacing = isTwoRows ? Math.min(118, 1100 / (cols + 1)) : spacing;
    var curStartX = 640 - ((cols - 1) * curSpacing) / 2;
    // So le nhẹ giữa hàng trên và hàng dưới để không bị che khuất
    var rowStagger = (row === 1) ? (curSpacing * 0.3) : 0;
    var bx = curStartX + col * curSpacing + rowStagger;
    var by = (row === 0) ? 560 : 635;
    var isGirl = (i % 2 === 1);

    actors.push({
      id: 'u_act_' + i,
      index: i,
      name: name,
      gender: isGirl ? 'girl' : 'boy',
      hairStyle: i % 6,
      hairColor: HAIR_COLS[i % HAIR_COLS.length],
      x: bx,
      y: by,
      baseX: bx,
      baseY: by,
      row: row,
      scale: isTwoRows ? 0.72 : 0.82,
      facing: (bx < 640 ? 1 : -1),
      action: 'STAND', // 'STAND', 'WALK', 'BEING_LIFTED', 'CAPTURED'
      animTimer: Math.random() * 10,
      floatHeight: 0,
      floatAngle: (Math.random() - 0.5) * 0.35,
      speechText: '',
      speechTimer: 0,
      isCaptured: false,
      rotation: 0
    });
  });

  // 120 Ngôi sao vũ trụ sâu thẳm
  var stars = [];
  for (var si = 0; si < 120; si++) {
    stars.push({
      x: Math.random() * 1280,
      y: Math.random() * 520,
      r: Math.random() * 1.9 + 0.5,
      ph: Math.random() * 6.28,
      speed: Math.random() * 0.003 + 0.001,
      isCross: (si % 12 === 0) // Ngôi sao tỏa 4 tia sáng lấp lánh
    });
  }

  // Khởi tạo UFO đĩa bay vũ trụ
  var saucer = {
    x: 640,
    y: 115,
    targetX: 640,
    targetY: 115,
    tilt: 0,
    beamAlpha: 0,
    beamActive: false,
    ledPhase: 0,
    alienEyeAngle: 0
  };

  return {
    cv: cv, x: x, W: W, H: H, P: P,
    actors: actors,
    stars: stars,
    saucer: saucer,
    cinePhase: 'IDLE',
    cineTimer: 0,
    scanX: 640,
    scanDir: 1,
    winIndex: -1,
    running: false
  };
}

function drawHumanStudentCosmic(ctx, actor) {
  ctx.save();
  ctx.translate(actor.x, actor.y);
  ctx.scale(actor.scale * actor.facing, actor.scale);
  ctx.rotate(actor.rotation);

  var isGirl = (actor.gender === 'girl');
  var t = actor.animTimer * 7.5;

  var leftLegAngle = 0, rightLegAngle = 0;
  var leftKneeFlex = 0, rightKneeFlex = 0;
  var leftArmAngle = 0, rightArmAngle = 0;
  var leftElbowFlex = 0, rightElbowFlex = 0;
  var bodyBob = 0, torsoTilt = 0;

  var isFloated = (actor.action === 'BEING_LIFTED' || actor.action === 'CAPTURED');

  if (actor.action === 'WALK') {
    var stride = Math.sin(t);
    leftLegAngle = stride * 0.42;
    rightLegAngle = -stride * 0.42;
    leftKneeFlex = stride < 0 ? Math.abs(stride) * 0.4 : 0;
    rightKneeFlex = stride > 0 ? Math.abs(stride) * 0.4 : 0;
    leftArmAngle = -stride * 0.38;
    rightArmAngle = stride * 0.38;
    leftElbowFlex = 0.25; rightElbowFlex = 0.25;
    bodyBob = Math.abs(Math.sin(t * 2)) * 3;
    torsoTilt = stride * 0.03;
  } else if (isFloated) {
    var floatT = actor.animTimer * 12;
    leftLegAngle = Math.sin(floatT + actor.x) * 0.7;
    rightLegAngle = -Math.sin(floatT + actor.x) * 0.7;
    leftKneeFlex = 0.4 + Math.abs(Math.sin(floatT * 1.5)) * 0.5;
    rightKneeFlex = 0.4 + Math.abs(Math.cos(floatT * 1.5)) * 0.5;
    leftArmAngle = -2.2 + Math.sin(floatT) * 0.5;
    rightArmAngle = -1.9 - Math.sin(floatT) * 0.5;
    leftElbowFlex = 0.4; rightElbowFlex = 0.4;
    bodyBob = Math.sin(floatT * 0.5) * 4;
  }

  // Bảng màu trang phục Phi Hành Gia Học Viện Vũ Trụ
  var skinTone = '#ffd7ba';
  var skinShadow = '#f8b896';
  var suitPrimary = '#1e1b4b'; // Xanh tím thẫm vũ trụ
  var suitAccent = '#38bdf8';  // Xanh Cyan năng lượng
  var suitGold = '#ffc23d';    // Vàng ánh kim Ngôi Sao
  var pantsColor = '#0f172a';
  var hasSkirt = isGirl && (actor.hairStyle % 2 === 0);

  function drawSneaker() {
    // Giày phi hành gia phát sáng đế neon
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-7, 0); ctx.lineTo(8, 0); ctx.quadraticCurveTo(12, 0, 14, -3);
    ctx.lineTo(13, -6); ctx.lineTo(-7, -6); ctx.closePath(); ctx.fill();
    // Đế phát sáng Cyan
    ctx.fillStyle = '#00f3ff';
    ctx.fillRect(-7, -2, 21, 2);
    ctx.fillStyle = suitPrimary;
    ctx.beginPath();
    ctx.moveTo(-7, -6); ctx.lineTo(13, -6); ctx.lineTo(10, -13); ctx.lineTo(2, -14);
    ctx.lineTo(-2, -11); ctx.lineTo(-7, -10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = suitGold;
    ctx.fillRect(-2, -11, 4, 3);
  }

  function drawHand(isOpen) {
    ctx.fillStyle = skinTone;
    if (isOpen) {
      ctx.beginPath(); ctx.arc(0, 0, 4.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-3.5, -2, 2, 4, -0.6, 0, Math.PI * 2); ctx.fill();
      for (var fi = -2; fi <= 2; fi += 1.3) {
        ctx.beginPath(); ctx.ellipse(fi * 2, 5, 1.6, 4.2, fi * 0.25, 0, Math.PI * 2); ctx.fill();
      }
    } else {
      ctx.beginPath(); ctx.ellipse(0, 2, 3.8, 5, 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(3, 1, 1.8, 3.2, 0.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 1. Cánh tay sau (Back Arm)
  ctx.save();
  ctx.translate(9, -64 + bodyBob);
  ctx.rotate(rightArmAngle);
  ctx.fillStyle = suitPrimary;
  ctx.beginPath(); ctx.moveTo(-4, -2); ctx.quadraticCurveTo(0, -4, 4, -2); ctx.lineTo(4, 11); ctx.lineTo(-4, 11); ctx.closePath(); ctx.fill();
  ctx.fillStyle = suitAccent; ctx.fillRect(-4, 9, 8, 2.5);
  ctx.translate(0, 14.5); ctx.rotate(rightElbowFlex);
  ctx.fillStyle = skinTone; ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(3, 0); ctx.lineTo(2.2, 14); ctx.lineTo(-2.2, 14); ctx.closePath(); ctx.fill();
  ctx.translate(0, 15); drawHand(isFloated);
  ctx.restore();

  // 2. Chân phải (Right Leg)
  ctx.save();
  ctx.translate(6, -34 + bodyBob);
  ctx.rotate(rightLegAngle);
  if (!hasSkirt) {
    ctx.fillStyle = pantsColor;
    ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.lineTo(4.2, 15); ctx.lineTo(-4.2, 15); ctx.closePath(); ctx.fill();
    ctx.fillStyle = suitAccent; ctx.fillRect(3, 0, 1.5, 15);
    ctx.translate(0, 15); ctx.rotate(rightKneeFlex);
    ctx.fillStyle = pantsColor;
    ctx.beginPath(); ctx.moveTo(-4.2, 0); ctx.lineTo(4.2, 0); ctx.quadraticCurveTo(4.5, 7, 3.2, 17); ctx.lineTo(-3.2, 17); ctx.quadraticCurveTo(-4, 7, -4.2, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = suitAccent; ctx.fillRect(2.3, 0, 1.5, 17);
    ctx.translate(0, 25); drawSneaker();
  } else {
    ctx.fillStyle = skinShadow; ctx.beginPath(); ctx.moveTo(-3.5, 0); ctx.lineTo(3.5, 0); ctx.lineTo(3, 16); ctx.lineTo(-3, 16); ctx.closePath(); ctx.fill();
    ctx.translate(0, 16); ctx.rotate(rightKneeFlex);
    ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(3, 0); ctx.lineTo(2.5, 16); ctx.lineTo(-2.5, 16); ctx.closePath(); ctx.fill();
    ctx.fillStyle = suitAccent; ctx.fillRect(-3.5, 9, 7, 7);
    ctx.translate(0, 24); drawSneaker();
  }
  ctx.restore();

  // 3. Thân áo đồng phục vũ trụ (Torso)
  ctx.save();
  ctx.translate(0, -64 + bodyBob);
  ctx.rotate(torsoTilt);
  ctx.fillStyle = suitPrimary;
  ctx.beginPath(); ctx.moveTo(-11, 0); ctx.lineTo(11, 0); ctx.lineTo(13, 30); ctx.lineTo(-13, 30); ctx.closePath(); ctx.fill();
  // Dải sáng viền ngực & Huy hiệu học viện vũ trụ
  ctx.fillStyle = suitGold; ctx.fillRect(-13, 26, 26, 3);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.lineTo(0, 8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = suitAccent;
  ctx.beginPath(); ctx.arc(0, 13, 3.5, 0, Math.PI * 2); ctx.fill();

  // Váy / Quần
  if (hasSkirt) {
    ctx.fillStyle = '#4338ca';
    ctx.beginPath(); ctx.moveTo(-13, 30); ctx.lineTo(13, 30); ctx.lineTo(19, 44); ctx.lineTo(-19, 44); ctx.closePath(); ctx.fill();
    ctx.fillStyle = suitAccent; ctx.fillRect(-18, 42, 36, 2);
  } else {
    ctx.fillStyle = pantsColor;
    ctx.fillRect(-13, 30, 26, 6);
  }
  ctx.restore();

  // 4. Chân trái (Left Leg)
  ctx.save();
  ctx.translate(-6, -34 + bodyBob);
  ctx.rotate(leftLegAngle);
  if (!hasSkirt) {
    ctx.fillStyle = pantsColor;
    ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.lineTo(4.2, 15); ctx.lineTo(-4.2, 15); ctx.closePath(); ctx.fill();
    ctx.fillStyle = suitAccent; ctx.fillRect(-4.5, 0, 1.5, 15);
    ctx.translate(0, 15); ctx.rotate(leftKneeFlex);
    ctx.fillStyle = pantsColor;
    ctx.beginPath(); ctx.moveTo(-4.2, 0); ctx.lineTo(4.2, 0); ctx.quadraticCurveTo(4.5, 7, 3.2, 17); ctx.lineTo(-3.2, 17); ctx.quadraticCurveTo(-4, 7, -4.2, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = suitAccent; ctx.fillRect(-3.8, 0, 1.5, 17);
    ctx.translate(0, 25); drawSneaker();
  } else {
    ctx.fillStyle = skinTone; ctx.beginPath(); ctx.moveTo(-3.5, 0); ctx.lineTo(3.5, 0); ctx.lineTo(3, 16); ctx.lineTo(-3, 16); ctx.closePath(); ctx.fill();
    ctx.translate(0, 16); ctx.rotate(leftKneeFlex);
    ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(3, 0); ctx.lineTo(2.5, 16); ctx.lineTo(-2.5, 16); ctx.closePath(); ctx.fill();
    ctx.fillStyle = suitAccent; ctx.fillRect(-3.5, 9, 7, 7);
    ctx.translate(0, 24); drawSneaker();
  }
  ctx.restore();

  // 5. Cổ và Đầu (Head)
  ctx.save();
  var headY = -87 + bodyBob;
  ctx.fillStyle = skinTone;
  ctx.beginPath(); ctx.moveTo(-5, headY + 11); ctx.lineTo(5, headY + 11); ctx.lineTo(6.5, headY + 19); ctx.lineTo(-6.5, headY + 19); ctx.closePath(); ctx.fill();

  // Khuôn mặt
  ctx.beginPath();
  ctx.moveTo(-13, headY - 6);
  ctx.bezierCurveTo(-14, headY + 8, -9, headY + 16, 0, headY + 18.5);
  ctx.bezierCurveTo(9, headY + 16, 14, headY + 8, 13, headY - 6);
  ctx.bezierCurveTo(13, headY - 22, -13, headY - 22, -13, headY - 6);
  ctx.closePath(); ctx.fill();

  // Tai
  ctx.beginPath(); ctx.ellipse(-13.5, headY + 2, 3.2, 5, -0.15, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13.5, headY + 2, 3.2, 5, 0.15, 0, Math.PI * 2); ctx.fill();
  // Má hồng
  ctx.fillStyle = 'rgba(251, 113, 133, 0.45)';
  ctx.beginPath(); ctx.ellipse(-7.5, headY + 7, 3.5, 2.2, 0, 0, Math.PI * 2); ctx.ellipse(7.5, headY + 7, 3.5, 2.2, 0, 0, Math.PI * 2); ctx.fill();

  // Mắt và Miệng
  if (isFloated) {
    // Mắt hoảng hốt trợn tròn
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(-5.5, headY, 4.5, 5.5, 0, 0, Math.PI * 2); ctx.ellipse(5.5, headY, 4.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(-5.5, headY, 2.4, 0, Math.PI * 2); ctx.arc(5.5, headY, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-6.2, headY - 1, 1.2, 0, Math.PI * 2); ctx.arc(4.8, headY - 1, 1.2, 0, Math.PI * 2); ctx.fill();
    // Miệng la hét chữ O
    ctx.fillStyle = '#881337'; ctx.beginPath(); ctx.ellipse(0, headY + 11.5, 4.5, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-3, headY + 7.5, 6, 2.5);
    ctx.fillStyle = '#f43f5e'; ctx.beginPath(); ctx.ellipse(0, headY + 14, 3, 2, 0, 0, Math.PI * 2); ctx.fill();
    // Giọt mồ hôi rơi
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath(); ctx.arc(14, headY - 5, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(14, headY - 10); ctx.lineTo(16.5, headY - 5); ctx.lineTo(11.5, headY - 5); ctx.closePath(); ctx.fill();
  } else {
    // Mắt cười tinh nghịch
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(-5.5, headY + 0.5, 3.8, 4.5, 0, 0, Math.PI * 2); ctx.ellipse(5.5, headY + 0.5, 3.8, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.ellipse(-5.5, headY + 0.5, 2.8, 3.8, 0, 0, Math.PI * 2); ctx.ellipse(5.5, headY + 0.5, 2.8, 3.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-6.5, headY - 1, 1.4, 0, Math.PI * 2); ctx.arc(4.5, headY - 1, 1.4, 0, Math.PI * 2);
    ctx.arc(-4.5, headY + 1.8, 0.8, 0, Math.PI * 2); ctx.arc(6.5, headY + 1.8, 0.8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#e11d48'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(0, headY + 8, 3.5, 0.2, Math.PI - 0.2); ctx.stroke();
  }

  // Tóc
  ctx.fillStyle = actor.hairColor;
  if (isGirl) {
    if (actor.hairStyle % 2 === 0) {
      ctx.beginPath(); ctx.arc(0, headY - 7, 15.5, Math.PI * 0.85, Math.PI * 2.15); ctx.fill();
      ctx.fillRect(-15, headY - 4, 3.5, 14); ctx.fillRect(11.5, headY - 4, 3.5, 14);
      ctx.fillStyle = suitGold; ctx.beginPath(); ctx.arc(-10, headY - 14, 4.5, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(0, headY - 6, 16.5, Math.PI * 0.8, Math.PI * 2.2); ctx.fill();
      ctx.fillRect(-16.5, headY - 4, 6, 26); ctx.fillRect(10.5, headY - 4, 6, 26);
    }
  } else {
    ctx.beginPath(); ctx.arc(0, headY - 7, 16, Math.PI * 0.82, Math.PI * 2.18); ctx.fill();
    ctx.fillRect(-14, headY - 8, 28, 7);
  }
  ctx.restore();

  // 6. Cánh tay trước (Front Arm)
  ctx.save();
  ctx.translate(-9, -64 + bodyBob);
  ctx.rotate(leftArmAngle);
  ctx.fillStyle = suitPrimary;
  ctx.beginPath(); ctx.moveTo(-4, -2); ctx.quadraticCurveTo(0, -4, 4, -2); ctx.lineTo(4, 11); ctx.lineTo(-4, 11); ctx.closePath(); ctx.fill();
  ctx.fillStyle = suitAccent; ctx.fillRect(-4, 9, 8, 2.5);
  ctx.translate(0, 14.5); ctx.rotate(leftElbowFlex);
  ctx.fillStyle = skinTone; ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(3, 0); ctx.lineTo(2.2, 14); ctx.lineTo(-2.2, 14); ctx.closePath(); ctx.fill();
  ctx.translate(0, 15); drawHand(isFloated);
  ctx.restore();

  ctx.restore();

  // THẺ TÊN KHÔNG GIAN THÔNG MINH (CHỐNG ĐÈ NHAU 100%)
  ctx.save();
  var isTargetLocked = (actor.action === 'CAPTURED');
  var labelY = isFloated ? (actor.y - 126 * actor.scale) : (actor.y + 12);
  
  // So le vị trí thẻ tên theo chỉ số chẵn/lẻ nếu đứng gần nhau
  if (!isFloated) {
    labelY += (actor.index % 2 === 0 ? 0 : 26);
  }

  ctx.font = '700 12px "Be Vietnam Pro",sans-serif';
  var tw = ctx.measureText(actor.name).width;
  var nw = tw + 18;

  // Hào quang khi bị khóa mục tiêu
  if (isTargetLocked) {
    ctx.shadowColor = '#ffc23d';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#ffc23d';
  } else if (isFloated) {
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#ef4444';
  } else {
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = 'rgba(11, 18, 48, 0.9)';
  }

  roundRectUFO(ctx, actor.x - nw / 2, labelY - 11, nw, 22, 11);
  ctx.fill();

  ctx.strokeStyle = isTargetLocked ? '#ffffff' : (isFloated ? '#fca5a5' : 'rgba(56, 189, 248, 0.6)');
  ctx.lineWidth = isTargetLocked ? 2 : 1.2;
  roundRectUFO(ctx, actor.x - nw / 2, labelY - 11, nw, 22, 11);
  ctx.stroke();

  ctx.fillStyle = isTargetLocked ? '#0b1230' : '#e2e8f0';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(actor.name, actor.x, labelY);
  ctx.restore();
}

function drawSpeechBubbleCosmic(ctx, bx, by, text) {
  ctx.save();
  ctx.font = '700 12.5px "Be Vietnam Pro",sans-serif';
  var tw = ctx.measureText(text).width;
  var bw = tw + 20;
  var bh = 28;
  var clampedX = Math.max(bw / 2 + 15, Math.min(1280 - bw / 2 - 15, bx));
  var bubbleY = by - 20;

  // Bóng đổ phát sáng vũ trụ
  ctx.shadowColor = 'rgba(0, 243, 255, 0.4)';
  ctx.shadowBlur = 10;
  ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
  roundRectUFO(ctx, clampedX - bw / 2, bubbleY - bh / 2, bw, bh, 8);
  ctx.fill();

  // Đuôi bóng thoại
  ctx.beginPath();
  ctx.moveTo(clampedX - 6, bubbleY + bh / 2);
  ctx.lineTo(bx, by);
  ctx.lineTo(clampedX + 8, bubbleY + bh / 2);
  ctx.closePath();
  ctx.fill();

  // Viền Cyan Neon
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 1.5;
  roundRectUFO(ctx, clampedX - bw / 2, bubbleY - bh / 2, bw, bh, 8);
  ctx.stroke();

  ctx.fillStyle = '#f8fafc';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, clampedX, bubbleY);
  ctx.restore();
}

function drawUFO(now, dt){
  if (!ufo) return;
  var u = ufo, x = u.x, W = u.W, H = u.H;
  if (!W || !H) return;

  var s = u.saucer;
  s.ledPhase += dt * 6;
  s.alienEyeAngle = Math.sin(now * 0.003) * 0.4;

  // Chuyển động đĩa bay UFO
  var dx = s.targetX - s.x;
  var dy = s.targetY - s.y;
  s.x += dx * Math.min(1, dt * 3.5);
  s.y += dy * Math.min(1, dt * 3.5);
  s.tilt = Math.max(-0.25, Math.min(0.25, dx * 0.0015));

  if (s.beamActive) s.beamAlpha = Math.min(1, s.beamAlpha + dt * 4);
  else s.beamAlpha = Math.max(0, s.beamAlpha - dt * 5);

  // Cập nhật hoạt ảnh các học sinh
  u.actors.forEach(function(a){
    a.animTimer += dt;
    if (a.speechTimer > 0) {
      a.speechTimer -= dt;
      if (a.speechTimer <= 0) a.speechText = '';
    }
  });

  // Tọa độ chuẩn 1280x720 co giãn tự động
  x.clearRect(0, 0, W, H);
  x.save();
  var scale = Math.min(W / 1280, H / 720);
  x.translate((W - 1280 * scale) / 2, (H - 720 * scale) / 2);
  x.scale(scale, scale);

  var PLATFORM_Y = 515;

  // 1. BẦU TRỜI VŨ TRỤ HUYỀN BÍ (COSMIC DEEP SPACE)
  var skyGrad = x.createLinearGradient(0, 0, 0, 720);
  skyGrad.addColorStop(0, '#040615');
  skyGrad.addColorStop(0.5, '#0b1230');
  skyGrad.addColorStop(1, '#181145');
  x.fillStyle = skyGrad;
  x.fillRect(0, 0, 1280, 720);

  // Dải mây tinh vân vũ trụ phát sáng (Nebula Clouds)
  var nebG1 = x.createRadialGradient(250, 180, 20, 250, 180, 340);
  nebG1.addColorStop(0, 'rgba(168, 85, 247, 0.18)');
  nebG1.addColorStop(0.6, 'rgba(99, 102, 241, 0.08)');
  nebG1.addColorStop(1, 'rgba(11, 18, 48, 0)');
  x.fillStyle = nebG1;
  x.fillRect(0, 0, 1280, 520);

  var nebG2 = x.createRadialGradient(1020, 260, 30, 1020, 260, 380);
  nebG2.addColorStop(0, 'rgba(6, 182, 212, 0.16)');
  nebG2.addColorStop(0.5, 'rgba(56, 189, 248, 0.07)');
  nebG2.addColorStop(1, 'rgba(11, 18, 48, 0)');
  x.fillStyle = nebG2;
  x.fillRect(0, 0, 1280, 520);

  // Ngôi sao vũ trụ lấp lánh & các sao tỏa 4 tia sáng
  u.stars.forEach(function(st){
    var alpha = 0.35 + 0.65 * Math.abs(Math.sin(now * st.speed + st.ph));
    x.fillStyle = 'rgba(255, 255, 255, ' + alpha + ')';
    x.beginPath();
    x.arc(st.x, st.y, st.r, 0, Math.PI * 2);
    x.fill();

    if (st.isCross) {
      x.strokeStyle = 'rgba(255, 255, 255, ' + (alpha * 0.75) + ')';
      x.lineWidth = 1;
      x.beginPath();
      x.moveTo(st.x - st.r * 3.5, st.y); x.lineTo(st.x + st.r * 3.5, st.y);
      x.moveTo(st.x, st.y - st.r * 3.5); x.lineTo(st.x, st.y + st.r * 3.5);
      x.stroke();
    }
  });

  // HÀNH TINH KHỔNG LỒ CÓ VÀNH ĐAI KEPLER (GIANT RINGED PLANET)
  x.save();
  var px = 1040, py = 160, pr = 70;
  // Hào quang khí quyển
  var atmoG = x.createRadialGradient(px, py, pr * 0.8, px, py, pr * 1.35);
  atmoG.addColorStop(0, 'rgba(56, 189, 248, 0.35)');
  atmoG.addColorStop(1, 'rgba(56, 189, 248, 0)');
  x.fillStyle = atmoG;
  x.beginPath(); x.arc(px, py, pr * 1.35, 0, Math.PI * 2); x.fill();

  // Nửa sau vành đai hành tinh
  x.save();
  x.translate(px, py);
  x.rotate(-0.35);
  x.strokeStyle = 'rgba(216, 180, 254, 0.35)';
  x.lineWidth = 14;
  x.beginPath();
  x.ellipse(0, 0, 140, 26, 0, Math.PI, 0); // Vẽ nửa sau
  x.stroke();
  x.restore();

  // Thân hành tinh với vân gradient tuyệt đẹp
  var planetG = x.createRadialGradient(px - pr * 0.35, py - pr * 0.35, pr * 0.1, px, py, pr);
  planetG.addColorStop(0, '#a855f7');
  planetG.addColorStop(0.4, '#6366f1');
  planetG.addColorStop(0.8, '#1e1b4b');
  planetG.addColorStop(1, '#0f172a');
  x.fillStyle = planetG;
  x.beginPath(); x.arc(px, py, pr, 0, Math.PI * 2); x.fill();

  // Nửa trước vành đai hành tinh (Đè lên quả cầu tạo chiều sâu 3D)
  x.save();
  x.translate(px, py);
  x.rotate(-0.35);
  x.strokeStyle = 'rgba(254, 240, 138, 0.65)';
  x.lineWidth = 14;
  x.beginPath();
  x.ellipse(0, 0, 140, 26, 0, 0, Math.PI); // Vẽ nửa trước
  x.stroke();
  // Vệt bụi vành đai phụ
  x.strokeStyle = 'rgba(56, 189, 248, 0.4)';
  x.lineWidth = 4;
  x.beginPath();
  x.ellipse(0, 0, 155, 30, 0, 0, Math.PI);
  x.stroke();
  x.restore();
  x.restore();

  // MẶT TRĂNG VỆ TINH PHÁT SÁNG PHÍA XA (COSMIC SATELLITE MOON)
  var mx = 180, my = 110, mr = 26;
  var moonG = x.createRadialGradient(mx - 7, my - 7, 3, mx, my, mr);
  moonG.addColorStop(0, '#fef08a');
  moonG.addColorStop(0.7, '#eab308');
  moonG.addColorStop(1, '#713f12');
  x.fillStyle = moonG;
  x.beginPath(); x.arc(mx, my, mr, 0, Math.PI * 2); x.fill();
  x.fillStyle = 'rgba(161, 98, 7, 0.4)';
  x.beginPath(); x.arc(mx - 6, my + 4, 5, 0, Math.PI * 2); x.fill();
  x.beginPath(); x.arc(mx + 8, my - 5, 4, 0, Math.PI * 2); x.fill();

  // TRẠM KHÔNG GIAN QUỸ ĐẠO XA XĂM (ORBITAL SPACE STATION HORIZON)
  x.strokeStyle = 'rgba(148, 163, 184, 0.45)';
  x.lineWidth = 1.5;
  x.fillStyle = 'rgba(30, 41, 59, 0.7)';
  // Vòm trạm thí nghiệm
  x.beginPath(); x.arc(430, PLATFORM_Y - 12, 45, Math.PI, 0); x.fill(); x.stroke();
  x.beginPath(); x.arc(820, PLATFORM_Y - 10, 36, Math.PI, 0); x.fill(); x.stroke();
  // Tháp radar không gian với đèn chớp tín hiệu đỏ
  x.beginPath(); x.moveTo(510, PLATFORM_Y - 10); x.lineTo(510, PLATFORM_Y - 90); x.stroke();
  x.fillStyle = (Math.sin(now * 0.008) > 0) ? '#ef4444' : '#38bdf8';
  x.beginPath(); x.arc(510, PLATFORM_Y - 92, 3.5, 0, Math.PI * 2); x.fill();

  x.beginPath(); x.moveTo(740, PLATFORM_Y - 10); x.lineTo(740, PLATFORM_Y - 75); x.stroke();
  x.fillStyle = (Math.sin(now * 0.008 + 2) > 0) ? '#10b981' : '#ffc23d';
  x.beginPath(); x.arc(740, PLATFORM_Y - 77, 3, 0, Math.PI * 2); x.fill();

  // 2. SÀN ĐÁP NĂNG LƯỢNG VŨ TRỤ (COSMIC SPACEPORT PLATFORM)
  // Mặt bệ phóng viễn tưởng màu titanium đậm
  var platGrad = x.createLinearGradient(0, PLATFORM_Y, 0, 720);
  platGrad.addColorStop(0, '#0f172a');
  platGrad.addColorStop(0.3, '#1e293b');
  platGrad.addColorStop(1, '#090d16');
  x.fillStyle = platGrad;
  x.beginPath();
  x.moveTo(40, PLATFORM_Y);
  x.lineTo(1240, PLATFORM_Y);
  x.lineTo(1280, 720);
  x.lineTo(0, 720);
  x.closePath();
  x.fill();

  // LƯỚI NĂNG LƯỢNG NEON CYAN & GOLD (CYBER SPACE GRID)
  x.lineWidth = 1.2;
  // Các đường ngang phối cảnh xa gần
  var gridYs = [530, 560, 600, 650, 710];
  gridYs.forEach(function(gy, idx){
    x.strokeStyle = (idx % 2 === 0) ? 'rgba(56, 189, 248, 0.35)' : 'rgba(255, 194, 61, 0.25)';
    x.beginPath();
    var xOffset = (gy - PLATFORM_Y) * 0.2;
    x.moveTo(40 - xOffset, gy);
    x.lineTo(1240 + xOffset, gy);
    x.stroke();
  });
  // Các đường dọc tỏa tia phối cảnh 3D
  for (var gx = 80; gx <= 1200; gx += 85) {
    x.strokeStyle = 'rgba(56, 189, 248, 0.2)';
    x.beginPath();
    var bottomX = 640 + (gx - 640) * 1.15;
    x.moveTo(gx, PLATFORM_Y);
    x.lineTo(bottomX, 720);
    x.stroke();
  }

  // GỜ VIỀN NĂNG LƯỢNG PHÁT SÁNG NEON (NEON HAZARD LIGHT STRIP)
  x.strokeStyle = '#00f3ff';
  x.lineWidth = 3.5;
  x.shadowColor = '#00f3ff';
  x.shadowBlur = 12;
  x.beginPath();
  x.moveTo(35, PLATFORM_Y);
  x.lineTo(1245, PLATFORM_Y);
  x.stroke();
  x.shadowBlur = 0;

  // Dãy đèn LED cảnh báo phi thuyền hạ cánh
  for (var li = 60; li <= 1220; li += 55) {
    var isAlt = (Math.floor((li + now * 0.1) / 55) % 2 === 0);
    x.fillStyle = isAlt ? '#ffc23d' : '#38bdf8';
    x.beginPath();
    x.arc(li, PLATFORM_Y, 3, 0, Math.PI * 2);
    x.fill();
  }

  // 3. CHÙM TIA HÚT QUANTUM MEGA TRACTOR BEAM
  if (s.beamAlpha > 0.05) {
    var bGrad = x.createLinearGradient(s.x, s.y + 40, s.x, 660);
    bGrad.addColorStop(0, 'rgba(56, 189, 248, ' + (0.85 * s.beamAlpha) + ')');
    bGrad.addColorStop(0.35, 'rgba(45, 212, 191, ' + (0.5 * s.beamAlpha) + ')');
    bGrad.addColorStop(0.8, 'rgba(255, 194, 61, ' + (0.35 * s.beamAlpha) + ')');
    bGrad.addColorStop(1, 'rgba(20, 184, 166, ' + (0.12 * s.beamAlpha) + ')');
    x.fillStyle = bGrad;
    x.beginPath();
    x.moveTo(s.x - 70, s.y + 40);
    x.lineTo(s.x + 70, s.y + 40);
    x.lineTo(s.x + 590, 660);
    x.lineTo(s.x - 590, 660);
    x.closePath();
    x.fill();

    // Hào quang tỏa tròn trên sàn không gian
    x.fillStyle = 'rgba(0, 243, 255, ' + (0.45 * s.beamAlpha) + ')';
    x.beginPath();
    x.ellipse(s.x, 660, 590, 38, 0, 0, Math.PI * 2);
    x.fill();

    // Các vòng tròn năng lượng lượng tử xoắn ốc cuộn lên
    for (var ri = 0; ri < 4; ri++) {
      var rY = s.y + 60 + ((now * 0.16 + ri * 115) % (660 - s.y - 70));
      var rProg = (rY - s.y - 60) / (660 - s.y - 70);
      var rW = 75 + rProg * 490;
      x.strokeStyle = 'rgba(255, 255, 255, ' + (0.65 * (1 - rProg) * s.beamAlpha) + ')';
      x.lineWidth = 2.5;
      x.beginPath();
      x.ellipse(s.x, rY, rW, 10 + rProg * 14, 0, 0, Math.PI * 2);
      x.stroke();
    }
  }

  // 4. TIA LASER QUÉT RADAR HỒNG TÂM (HOLOGRAPHIC SCANNER)
  if (['SUSPENSE_HOLD', 'SNATCH'].indexOf(u.cinePhase) >= 0 && s.beamAlpha > 0.1) {
    var isLocked = (u.cinePhase === 'SNATCH');
    x.strokeStyle = isLocked ? '#ef4444' : '#ffc23d';
    x.lineWidth = isLocked ? 4 : 2;
    x.beginPath();
    x.moveTo(s.x, s.y + 40);
    x.lineTo(u.scanX, 600);
    x.stroke();

    // Vòng tròn hồng tâm quét mục tiêu
    x.strokeStyle = isLocked ? '#ef4444' : '#00f3ff';
    x.lineWidth = 2;
    x.beginPath();
    x.arc(u.scanX, 600, 32, 0, Math.PI * 2);
    x.stroke();

    x.beginPath();
    x.moveTo(u.scanX - 42, 600); x.lineTo(u.scanX + 42, 600);
    x.moveTo(u.scanX, 600 - 42); x.lineTo(u.scanX, 600 + 42);
    x.stroke();

    x.fillStyle = isLocked ? '#ef4444' : '#ffc23d';
    x.font = '700 11.5px "Be Vietnam Pro",sans-serif';
    x.textAlign = 'center';
    x.fillText(isLocked ? '🎯 ĐÃ KHÓA!' : '⚡ RADAR QUÉT...', u.scanX, 550);
  }

  // ĐĨA HÒA NĂNG LƯỢNG HOVER PAD DƯỚI CHÂN MỖI HỌC SINH
  u.actors.forEach(function(a){
    x.save();
    var padAlpha = (a.action === 'BEING_LIFTED' || a.action === 'CAPTURED') ? 0.2 : 0.6;
    x.fillStyle = 'rgba(56, 189, 248, ' + (padAlpha * 0.4) + ')';
    x.beginPath();
    x.ellipse(a.baseX, a.baseY, 28 * a.scale, 7 * a.scale, 0, 0, Math.PI * 2);
    x.fill();
    x.strokeStyle = (a.action === 'CAPTURED') ? '#ffc23d' : '#00f3ff';
    x.lineWidth = 1.5;
    x.stroke();
    x.restore();
  });

  // 5. VẼ CÁC HỌC SINH PHI HÀNH GIA (Sắp xếp theo trục Y)
  var sortedActors = u.actors.slice().sort(function(a, b){ return a.y - b.y; });
  sortedActors.forEach(function(a){
    drawHumanStudentCosmic(x, a);
  });

  // 6. VẼ BONG BÓNG THOẠI TRUYỆN TRANH
  u.actors.forEach(function(a){
    if (a.speechText && !a.isCaptured) {
      drawSpeechBubbleCosmic(x, a.x, a.y - 105 * a.scale, a.speechText);
    }
  });

  // 7. ĐĨA BAY UFO VŨ TRỤ KHỔNG LỒ (HIGH-TECH MOTHERSHIP SAUCER)
  x.save();
  var ufoFloatY = s.y + Math.sin(now * 0.004) * 6;
  x.translate(s.x, ufoFloatY);
  x.rotate(s.tilt);

  // Luồng phản lực ion lượng tử xanh biếc
  var glowG = x.createRadialGradient(0, 30, 10, 0, 35, 80);
  glowG.addColorStop(0, 'rgba(0, 243, 255, 0.95)');
  glowG.addColorStop(0.5, 'rgba(56, 189, 248, 0.4)');
  glowG.addColorStop(1, 'rgba(11, 18, 48, 0)');
  x.fillStyle = glowG;
  x.beginPath();
  x.ellipse(0, 35, 130, 50, 0, 0, Math.PI * 2);
  x.fill();

  // Kính vòm buồng lái phát quang xanh thiên hà
  var domeG = x.createRadialGradient(0, -18, 5, 0, -10, 85);
  domeG.addColorStop(0, '#e0f2fe');
  domeG.addColorStop(0.5, '#38bdf8');
  domeG.addColorStop(1, '#0369a1');
  x.fillStyle = domeG;
  x.beginPath();
  x.ellipse(0, -10, 95, 75, 0, Math.PI, 0);
  x.fill();
  x.strokeStyle = 'rgba(255,255,255,0.7)';
  x.lineWidth = 1.5;
  x.stroke();

  // Người ngoài hành tinh Alien da xanh ngộ nghĩnh
  x.fillStyle = '#4ade80';
  x.beginPath();
  x.ellipse(0, -32, 17, 21, 0, 0, Math.PI * 2);
  x.fill();
  // Mắt to đen láy của Alien
  x.fillStyle = '#0f172a';
  x.beginPath();
  x.ellipse(-6 + s.alienEyeAngle * 3, -34, 5, 8, 0.25, 0, Math.PI * 2);
  x.ellipse(6 + s.alienEyeAngle * 3, -34, 5, 8, -0.25, 0, Math.PI * 2);
  x.fill();
  x.fillStyle = '#ffffff';
  x.beginPath();
  x.arc(-6.5 + s.alienEyeAngle * 3, -36, 1.8, 0, Math.PI * 2);
  x.arc(5.5 + s.alienEyeAngle * 3, -36, 1.8, 0, Math.PI * 2);
  x.fill();

  // Thân đĩa bay mạ kim loại bạc & titanium
  var topHullG = x.createLinearGradient(0, -10, 0, 30);
  topHullG.addColorStop(0, '#f8fafc');
  topHullG.addColorStop(0.5, '#cbd5e1');
  topHullG.addColorStop(1, '#64748b');
  x.fillStyle = topHullG;
  x.beginPath();
  x.ellipse(0, 14, 255, 54, 0, 0, Math.PI * 2);
  x.fill();
  x.strokeStyle = '#94a3b8'; x.lineWidth = 2; x.stroke();

  // Đĩa đáy viễn tưởng
  var botHullG = x.createLinearGradient(0, 15, 0, 50);
  botHullG.addColorStop(0, '#334155');
  botHullG.addColorStop(1, '#0f172a');
  x.fillStyle = botHullG;
  x.beginPath();
  x.ellipse(0, 30, 225, 40, 0, 0, Math.PI * 2);
  x.fill();

  // 14 Đèn LED photon lượng tử đổi màu xoay tít rực rỡ
  var ledColors = ['#00f3ff', '#ffc23d', '#ec4899', '#10b981', '#3b82f6', '#f59e0b', '#a855f7'];
  for (var li = 0; li < 14; li++) {
    var ang = (li / 14) * Math.PI;
    var colIdx = Math.floor((li + s.ledPhase) % ledColors.length);
    x.fillStyle = ledColors[colIdx];
    x.shadowColor = ledColors[colIdx];
    x.shadowBlur = 10;
    x.beginPath();
    x.arc(Math.cos(ang) * 220, 16 + Math.sin(ang) * 35, 5.5, 0, Math.PI * 2);
    x.fill();
  }
  x.shadowBlur = 0;

  // Bảng điện tử hiển thị phi thuyền
  x.fillStyle = '#022c22';
  roundRectUFO(x, -60, 2, 120, 32, 6);
  x.fill();
  x.strokeStyle = '#10b981'; x.lineWidth = 1.5;
  roundRectUFO(x, -60, 2, 120, 32, 6);
  x.stroke();
  x.fillStyle = '#34d399';
  x.font = '700 13px monospace';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillText('🛸 STAR-UFO', 0, 18);

  x.restore();
  x.restore();
}

function runUFO(P, w){
  return new Promise(function(done){
    var u = ufo;
    if (!u) { done(); return; }
    u.winIndex = w;
    u.running = true;
    u.cinePhase = 'UFO_ENTER';
    u.cineTimer = 0;

    var s = u.saucer;
    s.targetX = 640;
    s.targetY = 160;
    s.beamActive = false;

    // Phát âm thanh UFO xuất hiện
    playUfoTone(120, 380, 'sine', 1.0, 0.2);

    var targetActor = u.actors[w];

    var timer = setInterval(function(){
      var dt = 0.05;
      u.cineTimer += dt;

      if (u.cinePhase === 'UFO_ENTER') {
        if (u.cineTimer >= 1.0) {
          u.cinePhase = 'MASS_LIFT';
          u.cineTimer = 0;
          s.beamActive = true;
          // Hiệu ứng âm thanh chùm tia hút
          playUfoTone(240, 520, 'triangle', 1.5, 0.25);

          // Tất cả học sinh bị nhấc bổng khỏi sàn năng lượng!
          u.actors.forEach(function(a){
            a.action = 'BEING_LIFTED';
          });
          // Chọn ngẫu nhiên 2 học sinh phát câu thoại hốt hoảng
          var cand1 = u.actors[Math.floor(Math.random() * u.actors.length)];
          if (cand1) {
            cand1.speechText = UFO_BANTER_SCARED[Math.floor(Math.random() * UFO_BANTER_SCARED.length)];
            cand1.speechTimer = 3.0;
          }
        }
      } else if (u.cinePhase === 'MASS_LIFT') {
        var prog = Math.min(1, u.cineTimer / 1.5);
        u.actors.forEach(function(a, idx){
          if (!a.isCaptured) {
            var h = 95 + ((idx * 27) % 65);
            a.floatHeight = h * prog;
            a.y = a.baseY - a.floatHeight;
            a.rotation = a.floatAngle * prog;
          }
        });

        if (u.cineTimer >= 1.6) {
          u.cinePhase = 'SUSPENSE_HOLD';
          u.cineTimer = 0;
          u.scanX = 300;
          u.scanDir = 1;
        }
      } else if (u.cinePhase === 'SUSPENSE_HOLD') {
        // Học sinh lơ lửng bồng bềnh
        u.actors.forEach(function(a, idx){
          if (!a.isCaptured) {
            a.y = a.baseY - a.floatHeight + Math.sin(u.cineTimer * 4 + idx) * 7;
            a.rotation = a.floatAngle + Math.sin(u.cineTimer * 3 + idx) * 0.1;
          }
        });

        // Tia laser quét tìm qua lại
        u.scanX += u.scanDir * dt * 820;
        if (u.scanX > 1050) { u.scanX = 1050; u.scanDir = -1; playUfoTone(680, 500, 'sine', 0.1, 0.1); }
        else if (u.scanX < 230) { u.scanX = 230; u.scanDir = 1; playUfoTone(680, 500, 'sine', 0.1, 0.1); }

        if (u.cineTimer >= 2.2) {
          u.cinePhase = 'SNATCH';
          u.cineTimer = 0;

function closestPoint(px, py, x1, y1, x2, y2){
  var vx = x2 - x1, vy = y2 - y1, l2 = vx * vx + vy * vy || 1;
  var t = clamp(((px - x1) * vx + (py - y1) * vy) / l2, 0, 1);
  return { x: x1 + t * vx, y: y1 + t * vy, t: t };
}

function resolveSeg(b, s, boost){
  var q = closestPoint(b.x, b.y, s.x1, s.y1, s.x2, s.y2);
  var dx = b.x - q.x, dy = b.y - q.y;
  var d = Math.hypot(dx, dy) || 0.0001;
  var minD = b.r + s.w / 2;
  if (d < minD) {
    var nx = dx / d, ny = dy / d;
    var pen = minD - d;
    b.x += nx * pen; b.y += ny * pen;
    var vn = b.vx * nx + b.vy * ny;
    if (vn < 0) {
      var e = 0.42;
      b.vx -= (1 + e) * vn * nx;
      b.vy -= (1 + e) * vn * ny;
    }
    if (boost) {
      b.vx += nx * boost;
      b.vy += ny * boost;
    }
    return true;
  }
  return false;
}

function resolveCircle(b, c){
  var dx = b.x - c.x, dy = b.y - c.y;
  var d = Math.hypot(dx, dy) || 0.001;
  var min = b.r + c.r;
  if (d < min) {
    var nx = dx / d, ny = dy / d;
    var pen = min - d;
    b.x += nx * pen; b.y += ny * pen;
    var vn = b.vx * nx + b.vy * ny;
    if (vn < 0) {
      var e = c.type === 'bumper' ? 0.75 : 0.62;
      b.vx -= (1 + e) * vn * nx;
      b.vy -= (1 + e) * vn * ny;
    }
    if (c.type === 'bumper') {
      c.flash = performance.now();
      b.vx += nx * 140;
      b.vy += ny * 140;
      tone(450 + Math.random() * 200, 0.06, 'triangle', 0.06);
    } else {
      c.flash = performance.now();
      if (Math.random() < 0.2) tone(900 + Math.random() * 400, 0.02, 'sine', 0.02);
    }
    return true;
  }
  return false;
}

function resolveBalls(a, b){
  var dx = b.x - a.x, dy = b.y - a.y;
  var d = Math.hypot(dx, dy) || 0.001;
  var min = a.r + b.r;
  if (d >= min) return;
  var nx = dx / d, ny = dy / d;
  var pen = (min - d) / 2;
  a.x -= nx * pen; a.y -= ny * pen;
  b.x += nx * pen; b.y += ny * pen;
  var rvx = b.vx - a.vx, rvy = b.vy - a.vy;
  var vn = rvx * nx + rvy * ny;
  if (vn > 0) return;
  var imp = -(1 + 0.52) * vn / 2;
  a.vx -= imp * nx; a.vy -= imp * ny;
  b.vx += imp * nx; b.vy += imp * ny;
}

  // Đệm nảy Pinball Bumpers & Galton Pegs
  r.track.circles.forEach(function(o){
    if (o.y >= r.cameraY - 40 && o.y <= r.cameraY + h + 40) {
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 6.28);
      if (o.type === 'bumper') {
        var isFlashing = o.flash && (now - o.flash < 250);
        ctx.fillStyle = isFlashing ? '#ffd23c' : '#ff4d66';
        ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.stroke();
        ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 0.45, 0, 6.28);
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
      } else {
        ctx.fillStyle = '#ffc23d'; ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
      }
    }
  });

  // Cánh quạt quay Rotors (3-Blade Propellers)
  r.track.rotors.forEach(function(ro){
    if (ro.y >= r.cameraY - 100 && ro.y <= r.cameraY + h + 100) {
      ctx.save();
      ctx.translate(ro.x, ro.y);
      ctx.rotate(ro.angle);
      for (var a = 0; a < 3; a++) {
        ctx.save();
        ctx.rotate((a * Math.PI * 2) / 3);
        ctx.strokeStyle = '#ff9f3d'; ctx.lineWidth = 12; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(ro.len / 2, 0); ctx.stroke();
        ctx.strokeStyle = '#ffc23d'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(ro.len / 2 - 4, 0); ctx.stroke();
        ctx.restore();
      }
      ctx.fillStyle = '#121a3d'; ctx.strokeStyle = '#ffc23d'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 14, 0, 6.28); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  });

  // VẠCH ĐÍCH (FINISH LINE)
  var fy = r.track.finishY;
  if (fy >= r.cameraY - 60 && fy <= r.cameraY + h + 60) {
    for (var fi = 0; fi < 18; fi++) {
      ctx.fillStyle = fi % 2 ? '#ffffff' : '#0b1230';
      ctx.fillRect(140 + fi * 30, fy, 30, 14);
      ctx.fillStyle = fi % 2 ? '#0b1230' : '#ffffff';
      ctx.fillRect(140 + fi * 30, fy + 14, 30, 14);
    }
    ctx.fillStyle = '#ff7b72';
    ctx.font = '900 20px "Be Vietnam Pro",sans-serif';
    ctx.fillText('★ ĐÍCH ★', 95, fy + 22);
    ctx.fillText('★ ĐÍCH ★', 725, fy + 22);
  }

  // CÁC VIÊN BI & HIỆU ỨNG TỐC ĐỘ
  var ranking = getMarbleRanking(r);
  var lead1 = ranking[0], lead2 = ranking[1];

  // Cập nhật Leaderboard UI
  var rankBox = $('#marbleRankList');
  if (rankBox && ranking.length) {
    rankBox.innerHTML = ranking.slice(0, 3).map(function(mb, idx){
      var medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : '🥉';
      var col = idx === 0 ? '#ffc23d' : idx === 1 ? '#eef2ff' : '#ffa86b';
      return '<div style="display:flex; align-items:center; gap:6px; margin-bottom:3px; font-weight:700; color:' + col + ';">'
        + '<span>' + medal + '</span><span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:110px;">' + esc(mb.name) + '</span>'
        + '</div>';
    }).join('');
  }

  r.balls.forEach(function(b){
    if (b.y < r.cameraY - 80 || b.y > r.cameraY + h + 80) return;

    // Vệt tốc độ rực sáng cho bi dẫn đầu
    if ((b.id === lead1?.id || b.id === lead2?.id) && r.started && !b.finish) {
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 8) b.trail.shift();
      ctx.save();
      for (var t = 0; t < b.trail.length - 1; t++) {
        var alpha = (t + 1) / b.trail.length * 0.45;
        var width = (t + 1) / b.trail.length * (b.r * 1.6);
        ctx.strokeStyle = b.id === lead1?.id ? 'rgba(255, 194, 61, ' + alpha + ')' : 'rgba(255, 123, 114, ' + alpha + ')';
        ctx.lineWidth = width; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(b.trail[t].x, b.trail[t].y); ctx.lineTo(b.trail[t + 1].x, b.trail[t + 1].y); ctx.stroke();
      }
      ctx.restore();
    }

    // Vòng hào quang vàng cho bi dẫn đầu
    if (b.id === lead1?.id && !b.finish && r.started) {
      ctx.save();
      ctx.shadowColor = '#ffc23d'; ctx.shadowBlur = 24;
      ctx.fillStyle = '#ffc23d';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, 0, 6.28); ctx.fill();
      ctx.restore();
    }

    // Thân bi thủy tinh 3D
    ctx.save();
    var bGrad = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.35, 1, b.x, b.y, b.r);
    bGrad.addColorStop(0, '#ffffff');
    bGrad.addColorStop(0.35, b.color);
    bGrad.addColorStop(1, '#080d24');
    ctx.fillStyle = bGrad;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.28); ctx.fill();
    ctx.strokeStyle = b.id === lead1?.id ? '#ffc23d' : '#ffffff';
    ctx.lineWidth = 2; ctx.stroke();

    // Số STT trên bi
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 9px "Be Vietnam Pro",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.stt, b.x, b.y + 0.5);
    ctx.restore();

    // Thẻ tên nổi phía trên bi
    if (b.id === lead1?.id || b.id === lead2?.id || !r.started || Math.abs(b.y - (ranking[0]?.y || 0)) < 160) {
      ctx.save();
      ctx.font = '800 11px "Be Vietnam Pro",sans-serif';
      var tw = ctx.measureText(b.name).width + 14;
      ctx.fillStyle = b.id === lead1?.id ? '#ffc23d' : 'rgba(18, 26, 61, 0.9)';
      ctx.strokeStyle = '#2a3670'; ctx.lineWidth = 1;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(b.x - tw / 2, b.y - b.r - 22, tw, 18, 9);
      else ctx.rect(b.x - tw / 2, b.y - b.r - 22, tw, 18);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = b.id === lead1?.id ? '#0b1230' : '#eef2ff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(b.name, b.x, b.y - b.r - 13);
      ctx.restore();
    }
  });

  ctx.restore();

  // Vẽ Mini-map ở góc phải
  drawMarbleMini(r);
}

function drawMarbleMini(r){
  if (!r.mx || !r.miniCv) return;
  var mctx = r.mx, mw = r.miniCv.width, mh = r.miniCv.height;
  mctx.clearRect(0, 0, mw, mh);

  // Background mini-map
  mctx.fillStyle = '#121a3d';
  mctx.fillRect(0, 0, mw, mh);

  var sx = mw / 820, sy = mh / r.track.worldH;

  // Vẽ các thanh ray thu nhỏ
  mctx.strokeStyle = '#2a3670';
  mctx.lineWidth = 1.5;
  r.track.segs.forEach(function(s){
    mctx.beginPath(); mctx.moveTo(s.x1 * sx, s.y1 * sy); mctx.lineTo(s.x2 * sx, s.y2 * sy); mctx.stroke();
  });

  // Vạch đích
  mctx.fillStyle = '#ff7b72';
  mctx.fillRect(10, r.track.finishY * sy, mw - 20, 2);

  // Khung nhìn camera
  var camY = r.cameraY * sy, camH = r.H * sy;
  mctx.fillStyle = 'rgba(255, 194, 61, 0.15)';
  mctx.fillRect(0, camY, mw, camH);
  mctx.strokeStyle = '#ffc23d';
  mctx.lineWidth = 1;
  mctx.strokeRect(0, camY, mw, camH);

  // Vẽ các chấm bi
  r.balls.forEach(function(b){
    mctx.fillStyle = b.finish ? '#4fd18f' : b.color;
    mctx.beginPath();
    mctx.arc(b.x * sx, b.y * sy, b.finish ? 3.5 : 2.5, 0, 6.28);
    mctx.fill();
  });
}

function stepMarblePhysics(r, dt, now){
  var g = r.started ? 340 : 90;

  for (var i = 0; i < r.balls.length; i++) {
    var b = r.balls[i];
    if (b.finish) continue;

    b.vy += g * dt;
    b.vx *= 0.992;
    b.vy *= 0.996;

    var maxSpeed = 480;
    var spd = Math.hypot(b.vx, b.vy);
    if (spd > maxSpeed) {
      b.vx = (b.vx / spd) * maxSpeed;
      b.vy = (b.vy / spd) * maxSpeed;
    }

    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // Chặn cửa xuất phát nếu chưa mở
    if (r.gateOpenProgress < 0.98) {
      var gateY = r.track.startGateY;
      var openW = r.gateOpenProgress * 255;
      var leftGateX = 410 - openW;
      var rightGateX = 410 + openW;

      if (b.y + b.r >= gateY - 6 && b.y - b.r <= gateY + 6) {
        if (r.gateOpenProgress === 0 || b.x <= leftGateX || b.x >= rightGateX) {
          b.y = gateY - b.r - 0.5;
          if (b.vy > 0) {
            b.vy = -b.vy * 0.22;
            b.vx += (Math.random() - 0.5) * 12;
          }
        }
      }
    }

    // Va chạm với ray & tường
    for (var s = 0; s < r.track.segs.length; s++) {
      resolveSeg(b, r.track.segs[s]);
    }

    // Va chạm với Bumpers & Pegs
    for (var c = 0; c < r.track.circles.length; c++) {
      resolveCircle(b, r.track.circles[c]);
    }

    // Va chạm với cánh quạt quay
    for (var ro = 0; ro < r.track.rotors.length; ro++) {
      var rot = r.track.rotors[ro];
      var x1 = rot.x + Math.cos(rot.angle) * rot.len / 2, y1 = rot.y + Math.sin(rot.angle) * rot.len / 2;
      var x2 = rot.x - Math.cos(rot.angle) * rot.len / 2, y2 = rot.y - Math.sin(rot.angle) * rot.len / 2;
      if (resolveSeg(b, { x1: x1, y1: y1, x2: x2, y2: y2, w: 13 }, 55)) {
        var tx = -Math.sin(rot.angle), ty = Math.cos(rot.angle);
        b.vx += tx * rot.speed * 26;
        b.vy += Math.max(30, ty * rot.speed * 26);
        tone(520 + Math.random() * 80, 0.04, 'sawtooth', 0.03);
      }
    }

    // Chống kẹt bi
    if (Math.abs(b.y - b.lastY) > 3) {
      b.lastY = b.y;
      b.lastMove = now;
    } else if (now - b.lastMove > 650 && r.started) {
      b.vx += (Math.random() - 0.5) * 90;
      b.vy = Math.max(b.vy, 95);
      b.lastMove = now;
    }

    // Giữ trong giới hạn ray
    b.x = clamp(b.x, 46 + b.r, 774 - b.r);

    // Kiểm tra cán vạch đích
    if (b.y >= r.track.finishY && !b.finish) {
      b.finish = now;
      r.finishOrder.push(b);
      tone(880, 0.2, 'triangle', 0.1);
    }
  }

  // Quay các cánh quạt
  for (var ro2 = 0; ro2 < r.track.rotors.length; ro2++) {
    r.track.rotors[ro2].angle += r.track.rotors[ro2].speed * dt;
  }

  // Va chạm bi với bi
  for (var i1 = 0; i1 < r.balls.length; i1++) {
    for (var j1 = i1 + 1; j1 < r.balls.length; j1++) {
      if (!r.balls[i1].finish && !r.balls[j1].finish) {
        resolveBalls(r.balls[i1], r.balls[j1]);
      }
    }
  }
}

function runMarble(P, w){
  return new Promise(function(done){
    var r = marble;
    r.finishOrder = [];
    r.win = -1;

    // Định hướng bi của học sinh `w` có chút lợi thế tốc độ nhẹ để về đích số 1
    var winBall = r.balls[w];

    // Xuất phát nhanh không chờ đợi, tốc độ 15s tới đích!
    tone(800, 0.18, 'triangle', 0.15);
    toast('🚀 Cuộc đua 15 giây bắt đầu — Xuất phát!');

    r.started = true;
    r.startTime = performance.now();

    // Mở cổng xuất phát mượt mà trong 0.6s
    var gateT0 = performance.now();
    var gateIv = setInterval(function(){
      var gp = Math.min(1, (performance.now() - gateT0) / 600);
      r.gateOpenProgress = gp;
      if (gp >= 1) clearInterval(gateIv);
    }, 25);

      // Theo dõi cuộc đua đến khi bi chiến thắng cán đích
      var checkFinish = setInterval(function(){
        // Tiếp thêm gia tốc cho bi chiến thắng ở nửa sau cuộc đua nếu cần
        if (winBall && !winBall.finish) {
          if (winBall.y > r.track.finishY * 0.7 && winBall.vy < 220) {
            winBall.vy += 45;
          }
        }
        if (r.finishOrder.length > 0) {
          clearInterval(checkFinish);
          var winnerBall = r.finishOrder[0];
          r.win = winnerBall.id;
          tone(523, 0.2, 'triangle', 0.1);
          tone(659, 0.2, 'triangle', 0.1, 0.1);
          tone(784, 0.4, 'triangle', 0.1, 0.2);
          FX(160, (r.W / 2), r.H * 0.6);
          setTimeout(done, 800);
        }
      }, 40);
  });
}

var WCOL = ['#ff9f3d', '#5b6cff', '#ff6fae', '#22b8a6', '#ffc23d', '#8a5cff', '#4fa3ff', '#ff7b72', '#3fcf7f', '#e05ad6'];
function drawWheel(P){
  var rot = wheelRot; wheelP = P;
  var cv = $('#wheel'); if (!cv) return;
  var box = $('#stageBody'), size = Math.max(160, Math.min(box.clientWidth, box.clientHeight) - 16);
  var x = fitCanvas(cv, size, size);

      if (i >= steps) {

        var p = s.pts[w], wr = s.wrap, br = s.cv.getBoundingClientRect();
        if (p.y < wr.scrollTop || p.y > wr.scrollTop + wr.clientHeight) wr.scrollTo({ top: p.y - wr.clientHeight / 2, behavior: 'smooth' });

      var nx = i === steps - 1 ? w : rnd(n); if (n > 1) while (nx === s.cur && i !== steps - 1) nx = rnd(n);

function getRallyState(){
  var c = cls();
  var curClsId = c ? c.id : 'default';
  if (!S.rally || S.rally.cls !== curClsId || !S.rally.teams || !S.rally.teams.length) {
    initRallyState(4, 5, false);
  }
  return S.rally;
}

function initRallyState(numTeams, totalStages, keepExistingSteps){
  var c = cls();
  var curClsId = c ? c.id : 'default';
  numTeams = numTeams || (S.rally ? S.rally.numTeams : 4) || 4;
  totalStages = totalStages || (S.rally ? S.rally.stages : 5) || 5;
  var students = (c && c.students) ? c.students : [];
  var teams = [];
  for (var i = 0; i < numTeams; i++) {
    var p = RALLY_TEAM_PRESETS[i % RALLY_TEAM_PRESETS.length];
    var oldTeam = (keepExistingSteps && S.rally && S.rally.teams) ? S.rally.teams[i] : null;
    teams.push({
      id: 't' + (i + 1),
      name: oldTeam ? oldTeam.name : p.name,
      icon: p.icon,
      color: p.color,
      border: p.border,
      bg: p.bg,
      step: oldTeam ? Math.min(oldTeam.step, totalStages) : 0,
      members: []
    });
  }
  if (students.length > 0) {
    var shuffled = shuffle(students);
    shuffled.forEach(function(stu, idx){
      teams[idx % numTeams].members.push(stu);
    });
  }
  S.rally = {
    cls: curClsId,
    numTeams: numTeams,
    stages: totalStages,
    teams: teams,
    winner: null
  };
  save();
  return S.rally;
}

function stepRallyTeam(idx, delta){
  var r = getRallyState();
  var team = r.teams[idx];
  if (!team) return;
  var oldStep = team.step;
  team.step = Math.max(0, Math.min(r.stages, team.step + delta));
  save();

  if (delta > 0) {
    tone(587, 0.12, 'triangle', 0.1);
    tone(880, 0.25, 'triangle', 0.1, 0.08);
  } else if (delta < 0) {
    tone(300, 0.15, 'sawtooth', 0.08);
  }

  renderRallyStage();

  if (team.step >= r.stages && oldStep < r.stages) {
    r.winner = team;
    save();
    showRallyWinner(team);
  }
}

function rollRallyStep(){
  var r = getRallyState();
  if (r.winner) {
    toast('🏆 Cuộc đua đã có đội về đích! Bấm "Đua lại từ đầu" để bắt đầu chặng mới.');
    return;
  }
  var candidateIndices = [];
  r.teams.forEach(function(t, i){
    if (t.step < r.stages) candidateIndices.push(i);
  });
  if (!candidateIndices.length) return;

  var chosenIdx = candidateIndices[rnd(candidateIndices.length)];
  var team = r.teams[chosenIdx];
  var steps = Math.random() < 0.35 ? 2 : 1;

  busy = true;

  // Luminous floating Dice HUD
  var diceModal = document.createElement('div');
  diceModal.className = 'rally-dice-modal';
  diceModal.innerHTML = '<div class="rally-dice-box">'
    + '<div style="font-size:14px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">🎲 XÚC XẮC NĂNG LƯỢNG VŨ TRỤ</div>'
    + '<div id="rallyDiceTeam" style="font-size:32px;font-weight:800;color:#fff;margin:10px 0;display:flex;align-items:center;justify-content:center;gap:10px">...</div>'
    + '<div id="rallyDiceVal" style="font-size:48px;font-weight:900;color:#ffc23d;margin:12px 0;text-shadow:0 0 20px rgba(255,194,61,0.6)">🎲 ?</div>'
    + '<div id="rallyDiceSub" style="font-size:13px;color:var(--muted)">Đang chọn đội tăng tốc...</div>'
    + '</div>';
  document.body.appendChild(diceModal);

  var count = 0;
  var iv = setInterval(function(){
    count++;
    var randTeam = r.teams[rnd(r.teams.length)];
    var randVal = (count % 2 === 0 ? '+1 CHẶNG 🚀' : '+2 CHẶNG 🔥');
    var elTeam = diceModal.querySelector('#rallyDiceTeam');
    var elVal = diceModal.querySelector('#rallyDiceVal');
    if (elTeam) elTeam.innerHTML = '<span style="font-size:36px">' + randTeam.icon + '</span> ' + esc(randTeam.name);
    if (elVal) elVal.textContent = randVal;
    tone(420 + count * 50, 0.05, 'triangle', 0.06);

    if (count > 12) {
      clearInterval(iv);
      busy = false;
      tone(880, 0.2, 'triangle', 0.12);
      tone(1174, 0.35, 'triangle', 0.12, 0.1);

      if (elTeam) {
        elTeam.innerHTML = '<span style="font-size:42px">' + team.icon + '</span> <span style="color:' + team.color + '">' + esc(team.name) + '</span>';
      }
      if (elVal) {
        elVal.innerHTML = '⚡ +' + steps + ' CHẶNG! 🚀';
        elVal.style.color = '#4fd18f';
      }
      var elSub = diceModal.querySelector('#rallyDiceSub');
      if (elSub) elSub.textContent = 'Phi thuyền đang kích hoạt động cơ phản lực!';

      stepRallyTeam(chosenIdx, steps);

      setTimeout(function(){
        diceModal.remove();
      }, 1200);
    }
  }, 85);
}

    if (tr) { el = new Audio(urlOf(tr)); el.volume = Math.min(1, S.music.vol * 1.2 + .1); el.play().catch(function(){}); }
    else { step = 0; nextT = a.currentTime + .05; schedule(); timer = setInterval(schedule, 25); }
    // tiếng động cơ: tiếng ồn qua bộ lọc, gầm to dần theo tốc độ tên lửa (chỉ khi đua)
    if (style === 'race') eng = a.createBufferSource();
    if (eng) { eng.buffer = noise; eng.loop = true; engF = a.createBiquadFilter(); engF.type = 'lowpass'; engF.frequency.setValueAtTime(180, a.currentTime);
    engF.frequency.linearRampToValueAtTime(1100, a.currentTime + 6); var eg = a.createGain(); eg.gain.value = tr ? .12 : .2;
    eng.connect(engF); engF.connect(eg); eg.connect(out); eng.start(); }
    // tiếng đàn ong vo ve: cao độ dao động nhẹ
    if (style === 'bee') {
      eng = a.createOscillator(); eng.type = 'sawtooth';
      var bt = a.currentTime; eng.frequency.setValueAtTime(175, bt);
      for (var bk = 1; bk <= 60; bk++) eng.frequency.linearRampToValueAtTime(165 + Math.random() * 40, bt + bk * .25);
      engF = a.createBiquadFilter(); engF.type = 'lowpass'; engF.frequency.value = 850;
      var bg2 = a.createGain(); bg2.gain.value = tr ? .03 : .05;
      eng.connect(engF); engF.connect(bg2); bg2.connect(out); eng.start();
    }
    if (!bgm.paused) bgm.volume = Math.min(bgm.volume, .06);
  }
  function stop(now){
    clearInterval(timer); timer = null;
    var d = now ? .05 : .9;
    if (out && a) { var o = out; o.gain.cancelScheduledValues(a.currentTime); o.gain.setValueAtTime(Math.max(.0001, o.gain.value), a.currentTime); o.gain.exponentialRampToValueAtTime(.0001, a.currentTime + d); setTimeout(function(){ try { o.disconnect(); } catch (e) {} }, d * 1000 + 100); }
    if (eng) { try { eng.stop(a.currentTime + d); } catch (e) {} eng = null; }
    if (el) { var e2 = el, v0 = e2.volume, k = 0; clearInterval(fadeIv); fadeIv = setInterval(function(){ k++; e2.volume = Math.max(0, v0 * (1 - k / 10)); if (k >= 10) { clearInterval(fadeIv); e2.pause(); } }, d * 100); el = null; }
    out = null; musicVol();
  }
  return { start: start, stop: stop, preview: function(st){ start(st); setTimeout(function(){ stop(); }, 7000); } };
})();

/* ---------- Tiếng reo “Yeah!” khi bắt được tên ---------- */
// Tổng hợp ngay trong trình duyệt (chạy được khi mất mạng): ~10 giọng trẻ em cùng hô “Yeah!” —
// mỗi giọng là nguồn răng cưa có rung giọng, đi qua 3 bộ lọc formant chuyển từ âm “ye” sang “a”,
// cao độ vút lên rồi ngân; các bạn hô lệch nhau một chút, đứng trái/phải khác nhau; thêm tiếng vỗ tay.
// Hoặc phát một tệp âm thanh đã tải lên (Thiết lập → Nhạc nền).
var Cheer = (function(){
  var noise = null, el = null;
  function nbuf(a){ var b = a.createBuffer(1, a.sampleRate * 2, a.sampleRate), d = b.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
  function voice(a, out, t0, f0, dur, pan){
    var src = a.createOscillator(); src.type = 'sawtooth';
    // cao độ: “y” thấp → vút lên “Yeah” → ngân rồi hạ dần
    src.frequency.setValueAtTime(f0 * .82, t0); src.frequency.exponentialRampToValueAtTime(f0 * 1.28, t0 + .22);
    src.frequency.exponentialRampToValueAtTime(f0 * 1.12, t0 + dur * .65); src.frequency.exponentialRampToValueAtTime(f0 * .78, t0 + dur);
    var vib = a.createOscillator(), vg = a.createGain(); vib.frequency.value = 5 + Math.random() * 1.5; vg.gain.setValueAtTime(0, t0); vg.gain.linearRampToValueAtTime(f0 * .035, t0 + .4);
    vib.connect(vg); vg.connect(src.frequency);
    var amp = a.createGain(); amp.gain.setValueAtTime(.0001, t0); amp.gain.exponentialRampToValueAtTime(1, t0 + .07);
    amp.gain.setValueAtTime(1, t0 + dur * .6); amp.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    src.connect(amp);
    var p = a.createStereoPanner ? a.createStereoPanner() : null; if (p) { p.pan.value = pan; p.connect(out); }
    var dest = p || out;
    // formant giọng trẻ: “ye” (F1 thấp, F2 cao) → “a” (F1 cao, F2 giữa) → “e”
    [[420, 1050, 760, 9, .9], [2700, 2050, 2150, 11, .55], [3500, 3400, 3400, 12, .25]].forEach(function(F){
      var bp = a.createBiquadFilter(), g = a.createGain(); bp.type = 'bandpass'; bp.Q.value = F[3];
      bp.frequency.setValueAtTime(F[0], t0); bp.frequency.exponentialRampToValueAtTime(F[1], t0 + .2); bp.frequency.exponentialRampToValueAtTime(F[2], t0 + dur);
      g.gain.value = F[4]; amp.connect(bp); bp.connect(g); g.connect(dest);
    });
    // hơi thở đầu tiếng “y”
    var ns = a.createBufferSource(), nf = a.createBiquadFilter(), ng = a.createGain(); ns.buffer = noise; nf.type = 'bandpass'; nf.frequency.value = 3200; nf.Q.value = 1.5;
    ng.gain.setValueAtTime(.0001, t0); ng.gain.exponentialRampToValueAtTime(.12, t0 + .03); ng.gain.exponentialRampToValueAtTime(.0001, t0 + .25);
    ns.connect(nf); nf.connect(ng); ng.connect(dest); ns.start(t0, Math.random()); ns.stop(t0 + .3);
    src.start(t0); vib.start(t0); src.stop(t0 + dur + .05); vib.stop(t0 + dur + .05);
  }
  function claps(a, out, t0, len, n){
    for (var i = 0; i < n; i++) {
      var t = t0 + Math.pow(Math.random(), 1.3) * len, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), p = a.createStereoPanner ? a.createStereoPanner() : null;
      s.buffer = noise; f.type = 'bandpass'; f.frequency.value = 1100 + Math.random() * 1600; f.Q.value = 1.2;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.5 + Math.random() * .4, t + .003); g.gain.exponentialRampToValueAtTime(.0001, t + .06 + Math.random() * .04);
      s.connect(f); f.connect(g); if (p) { p.pan.value = Math.random() * 1.6 - .8; g.connect(p); p.connect(out); } else g.connect(out);
      s.start(t, Math.random() * 1.5); s.stop(t + .12);
    }
  }
  function builtin(){
    var a = ac(); if (!a) return;
    noise = noise || nbuf(a);
    var t0 = a.currentTime + .02, comp = a.createDynamicsCompressor(), out = a.createGain();
    comp.threshold.value = -18; comp.ratio.value = 4; out.gain.value = Math.max(.35, Math.min(1, S.music.vol * 1.4)) * .85;
    out.connect(comp); comp.connect(a.destination);
    var vox = a.createGain(); vox.gain.value = .55; vox.connect(out);
    for (var i = 0; i < 10; i++) voice(a, vox, t0 + Math.random() * .14, 300 + Math.random() * 240, 1.05 + Math.random() * .5, Math.random() * 1.6 - .8);
    claps(a, out, t0 + .05, 2, 46);
  }
  function play(){
    if (!S.set.sound || S.music.cheer === 'off') return;
    var id = S.music.cheer, tr = id && id !== 'builtin' ? MUSIC.find(function(m){ return m.id === id; }) : null;
    if (!tr) return builtin();
    if (el) el.pause();
    el = new Audio(urlOf(tr)); el.volume = Math.min(1, S.music.vol * 1.2 + .25); el.play().catch(function(){});
    var e2 = el; setTimeout(function(){ var k = 0, v0 = e2.volume, iv = setInterval(function(){ k++; e2.volume = Math.max(0, v0 * (1 - k / 8)); if (k >= 8) { clearInterval(iv); e2.pause(); } }, 60); }, 3500);
  }
  return { play: play };
})();
function cheerSelect(){
  var v = S.music.cheer;
  return '<select class="inp" id="muCheer"><option value="builtin"' + (v === 'builtin' ? ' selected' : '') + '>🎉 Tiếng reo “Yeah!” của các bạn nhỏ (có sẵn)</option>'
    + MUSIC.map(function(t){ return '<option value="' + t.id + '"' + (v === t.id ? ' selected' : '') + '>' + esc(t.name) + '</option>'; }).join('')
    + '<option value="off"' + (v === 'off' ? ' selected' : '') + '>Không reo</option></select>';
}

/* ---------- Sự kiện chung ---------- */
$('#clsSel').addEventListener('change', function(e){ S.cur = e.target.value; save(); renderTop(); renderSide(); renderStage(); });
$('#modes').addEventListener('click', function(e){
  var b = e.target.closest('[data-m]'); if (!b || busy) return;
  S.mode = b.dataset.m; save(); renderTop(); renderStage();
});
$('#modes').addEventListener('wheel', function(e){
  if (this.scrollWidth > this.clientWidth && Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    this.scrollLeft += e.deltaY;
    e.preventDefault();
  }
}, { passive: false });
$('#stageFoot').addEventListener('click', function(e){ if (e.target.closest('#btnGo')) go(); if (e.target.closest('#btnGroup')) makeGroups(); if (e.target.closest('#btnRallyRoll')) rollRallyStep(); if (e.target.closest('#btnRallyReset')) resetRally(); if (e.target.closest('#btnRallyQ')) pickRallyQ(); });
$('#btnSet').addEventListener('click', function(){ openSet(); });
$('#btnQs').addEventListener('click', function(){ qEdit = null; openSet('cau'); });
$('#btnAddStu').addEventListener('click', function(){ openSet('lop'); var i = $('#newStu'); if (i) i.focus(); });
$('#btnSound').addEventListener('click', function(){ S.set.sound = !S.set.sound; save(); renderTop(); if (S.set.sound) SFX.star(); });
$('#btnFull').addEventListener('click', function(){ if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); });
$('#optNoRep').addEventListener('change', function(e){ S.set.noRepeat = e.target.checked; save(); renderSide(); renderStage(); });
$('#optAsk').addEventListener('change', function(e){ S.set.ask = e.target.checked; save(); renderTop(); if (S.set.ask && !qPool().length) openSet('cau'); });
$('#optSpeak').addEventListener('change', function(e){ S.set.speak = e.target.checked; save(); });
$('#optNoRepQ').addEventListener('change', function(e){ S.set.noRepeatQ = e.target.checked; save(); renderQLeft(); });
$('#btnResetQ').addEventListener('click', function(){ S.qUsed = S.qUsed || {}; S.qUsed[cls().id] = []; save(); renderQLeft(); toast('Đã làm mới — có thể dùng lại tất cả câu hỏi.'); });
$('#btnReset').addEventListener('click', function(){ S.picked[cls().id] = []; save(); renderSide(); renderStage(); toast('Đã bắt đầu vòng gọi mới.'); });
$('#names').addEventListener('click', function(e){
  var b = e.target.closest('[data-inc],[data-dec]'); if (!b) return;
  var n = cls().students[+(b.dataset.inc || b.dataset.dec)], st = stars();
  st[n] = Math.max(0, (st[n] || 0) + (b.dataset.inc ? 1 : -1)); if (!st[n]) delete st[n]; save(); renderSide(); if (b.dataset.inc) SFX.star();
});
document.addEventListener('keydown', function(e){
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'Escape') {
    if ($('#ovRes').classList.contains('show')) closeRes();
    else if ($('#ovSet').classList.contains('show')) $('[data-sx=close]').click();
    return;
  }
  if (e.code === 'Space' || e.key === 'Enter') {
    if ($('#ovSet').classList.contains('show')) return;
    e.preventDefault();
    if ($('#ovRes').classList.contains('show')) { closeRes(); return; }
    if (S.mode === 'group') makeGroups(); else if (S.mode === 'rally') rollRallyStep(); else go();
  }
});
// Màn hình hẹp: khung trò chơi cao vừa phần màn hình nằm dưới thanh trên cùng
function fitLayout(){
  var st = document.documentElement.style;
  if (innerWidth > 980 || (innerWidth > innerHeight && innerHeight <= 560)) { st.removeProperty('--stage-h'); return; }
  var top = $('.main').getBoundingClientRect().top + scrollY;
  var h = Math.max(300, Math.round(innerHeight - top - 10)) + 'px';
  if (st.getPropertyValue('--stage-h') !== h) { st.setProperty('--stage-h', h); return true; }
}
// Phông chữ tải xong làm thanh trên cao lên → đo lại cho khớp
function refit(){ if (fitLayout() && !busy) renderStage(); }
addEventListener('load', refit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
var rzT; addEventListener('resize', function(){ clearTimeout(rzT); rzT = setTimeout(function(){ fitLayout(); if (!busy) renderStage(); }, 150); });
fitLayout();
if (window.speechSynthesis) speechSynthesis.getVoices();

// Chạy không cần mạng: service worker lưu trò chơi, phông chữ, công thức vào máy
var offlineReady = false, storagePersisted = false, installEvt = null;
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').then(function(){ return navigator.serviceWorker.ready; }).then(function(){ offlineReady = true; }).catch(function(){});
}
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted().then(function(p){ return p || navigator.storage.persist(); }).then(function(p){ storagePersisted = !!p; }).catch(function(){});
}
addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); installEvt = e; });
addEventListener('offline', function(){ toast('Mất mạng — trò chơi vẫn dùng bình thường, dữ liệu vẫn được lưu.'); });

// Link mở thẳng một trò: …/#vong-xoay-thien-ha, #chien-ham-sieu-thanh, #bat-heo-sao-hoa...
var SLUG = {
  wheel: 'vong-xoay-thien-ha',
  race: 'chien-ham-sieu-thanh',
  pig: 'bat-heo-sao-hoa',
  sky: 'bau-troi-tinh-van',
  duck: 'bat-vit-san-dinh',
  machine: 'co-may-thoi-gian',
  card: 'mat-ma-dinh-menh',
  orb: 'trieu-hoi-tinh-cau',
  ufo: 'ufo-bi-an',
  vortex: 'ho-den-loc-xoay',
  marble: 'dua-bi-thien-ha',
  rally: 'chang-dua-ngan-ha',
  bee: 'dan-ong-ve-to',
  multi: 'goi-nhieu-ngoi-sao',
  group: 'chia-nhom'
};
var LEGACY_SLUG = {
  'vong-quay': 'wheel',
  'dua-ten-lua': 'race',
  'bat-heo': 'pig',
  'bau-troi-sao': 'sky',
  'bat-vit': 'duck',
  'co-may': 'machine',
  'la-bai': 'card',
  'tinh-cau': 'orb',
  'orb': 'orb',
  'ufo': 'ufo',
  'loc-xoay': 'vortex',
  'dua-bi': 'marble',
  'rally': 'rally'
};
function modeFromHash(){
  var h = decodeURIComponent(location.hash.slice(1));
  if (LEGACY_SLUG[h]) return LEGACY_SLUG[h];
  for (var m in SLUG) if (SLUG[m] === h || m === h) return m;
  return null;
}
var hm = modeFromHash(); if (hm) { S.mode = hm; save(); }
addEventListener('hashchange', function(){ var m = modeFromHash(); if (m && m !== S.mode && !busy) { S.mode = m; save(); renderTop(); renderStage(); } });
$('#modes').addEventListener('click', function(){ setTimeout(function(){ if (history.replaceState) history.replaceState(null, '', '#' + SLUG[S.mode]); }, 0); });

renderTop(); renderSide(); renderStage();
})();
