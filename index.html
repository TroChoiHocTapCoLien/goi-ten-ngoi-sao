<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gọi Tên Ngôi Sao</title>
<meta name="theme-color" content="#0b1230">
<meta name="description" content="Gọi tên học sinh ngẫu nhiên: vòng quay, đua tên lửa, bầu trời sao, chia nhóm, kèm câu hỏi.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="libs/katex.min.css">
<script defer src="libs/katex.min.js"></script>
<script defer src="libs/auto-render.min.js"></script>
<style>
:root{
  --sky:#0b1230; --sky2:#151f4a; --panel:#121a3d; --panel2:#1a2452; --line:#2a3670;
  --ink:#eef2ff; --muted:#a3add6; --star:#ffc23d; --star2:#ffe08a; --star-ink:#3a2700;
  --accent:#8aa6ff; --ok:#4fd18f; --bad:#ff7b72; --pink:#ff8fc7; --teal:#53d6d0;
  --f-display:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 700px at 70% -10%,#2a2f7a 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#3b1d5e 0%,transparent 55%),var(--sky);
  color:var(--ink);font-family:var(--f-body);font-size:16px;overflow-x:hidden}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1700px;margin:0 auto;padding:12px 16px 14px;gap:10px}

/* Thanh trên */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .logo{width:44px;height:44px;flex:none;filter:drop-shadow(0 0 12px rgba(255,194,61,.55))}
.brand h1{font-family:var(--f-display);font-size:26px;line-height:1;margin:0;letter-spacing:.2px}
.brand h1 small{display:block;font-family:var(--f-body);font-size:12.5px;font-weight:500;color:var(--muted);margin-top:4px;letter-spacing:.3px}
.cls{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 12px}
.cls label{font-size:13px;color:var(--muted)}
.cls select{background:transparent;border:0;font-weight:700;font-size:16px;padding:6px 4px;outline:none}
.cls select option{background:var(--panel)}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:42px;height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14.5px}
.ibtn:hover{background:var(--panel2)}
.ibtn svg{width:20px;height:20px}

/* Chế độ chơi (Không bị che khuất, tự động sắp xếp 2 hàng gọn gàng & cân đối) */
.modes{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:4px 0 6px;max-width:100%}
.mode{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;border:1px solid rgba(138,166,255,.22);background:rgba(18,26,61,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap;transition:all .16s ease;cursor:pointer;user-select:none}
.mode .em{font-size:16px;line-height:1;display:inline-block;transition:transform .18s ease}
.mode:hover{background:rgba(35,48,105,.85);color:#fff;border-color:rgba(138,166,255,.45);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.mode:hover .em{transform:scale(1.15)}
.mode[aria-pressed=true]{background:linear-gradient(135deg,#ffd45e,#ff9f3d);color:var(--star-ink);border-color:transparent;box-shadow:0 4px 16px rgba(255,170,60,.4);font-weight:700;transform:translateY(-1px)}
.mode[aria-pressed=true] .em{transform:scale(1.1)}

/* Bố cục chính */
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;min-height:0}
.stage{position:relative;min-height:0;border-radius:22px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(21,31,74,.75),rgba(11,18,48,.75));overflow:hidden;display:flex;flex-direction:column}
.stage-body{flex:1;position:relative;min-height:0}
.stage-foot{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px;border-top:1px solid var(--line);background:rgba(11,18,48,.55);flex-wrap:wrap}
.go{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:.5px;padding:10px 42px;border:0;border-radius:999px;color:var(--star-ink);
  background:linear-gradient(135deg,#ffe08a,#ffc23d 45%,#ff9f3d);box-shadow:0 6px 0 #b86f12,0 10px 28px rgba(255,170,60,.4);transition:transform .08s}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #b86f12}
.go:disabled{filter:grayscale(.6) brightness(.8);cursor:wait}
.hint{color:var(--muted);font-size:13.5px}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;color:var(--muted)}
.empty b{color:var(--ink);font-size:20px}

/* Vòng quay */
.wheel-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.wheel-wrap canvas{display:block}

/* Đua tên lửa · Bầu trời sao (vẽ bằng canvas) */
.cvwrap{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.cvwrap canvas{display:block}

/* Ghép cặp / nhóm */
.groups{position:absolute;inset:0;overflow-y:auto;padding:18px;display:grid;gap:14px;align-content:start;grid-auto-rows:max-content;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.grp{position:relative;border-radius:18px;border:1px solid color-mix(in srgb,var(--gc) 45%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--gc) 16%,#121a3d),#121a3d 70%);overflow:hidden;animation:grpIn .5s cubic-bezier(.2,1.4,.4,1) both;box-shadow:0 8px 24px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.03) inset}
.grp h3{margin:0;padding:10px 14px;font-family:var(--f-display);font-size:20px;color:var(--star-ink);background:var(--gc);display:flex;align-items:center;gap:8px}
.grp h3 small{margin-left:auto;font-family:var(--f-body);font-size:12.5px;font-weight:700;opacity:.7}
.grp ul{list-style:none;margin:0;padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px}
.grp li{padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.06);font-weight:700;font-size:17px}
.grp li.fly{animation:flyIn .7s cubic-bezier(.2,1.3,.4,1) both}
.gctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gctl select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.swirl{position:absolute;inset:0;overflow:hidden}
.swirl .orb{position:absolute;left:50%;top:50%;width:0;height:0;animation:orbit var(--d) linear infinite}
.swirl .orb i{position:absolute;transform:translate(var(--r),0);white-space:nowrap;font-style:normal;font-weight:800;font-size:15px;text-shadow:0 0 10px currentColor}
.swirl-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:64px;color:var(--star);text-shadow:0 0 30px var(--star);animation:pulse .5s ease-in-out infinite alternate}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pulse{to{transform:translate(-50%,-50%) scale(1.25) rotate(20deg)}}
@keyframes grpIn{from{opacity:0;transform:translateY(30px) scale(.8)}}
@keyframes flyIn{from{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4) rotate(-20deg)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}

/* Bảng bên */
.side{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;scrollbar-width:thin}
.side .card.grow{flex:1 1 140px;min-height:140px;display:flex;flex-direction:column}
.card{background:rgba(18,26,61,.85);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h2{font-family:var(--f-display);font-size:18px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{margin-left:auto;font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted)}
.meter{height:10px;border-radius:99px;background:#232e63;overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--accent));border-radius:99px;transition:width .3s}
.tg{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14.5px;cursor:pointer;user-select:none}
.tg input{appearance:none;width:40px;height:23px;border-radius:99px;background:#2a3670;position:relative;flex:none;cursor:pointer;transition:background .15s}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#cfd6f5;transition:transform .15s}
.tg input:checked{background:var(--ok)}
.tg input:checked::after{transform:translateX(17px);background:#fff}
.tg small{display:block;color:var(--muted);font-size:12.5px}
.names{list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.names li{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:9px;font-size:14.5px}
.names li:hover{background:rgba(138,166,255,.08)}
.names li.done .n{color:#6d78a8;text-decoration:line-through;text-decoration-color:rgba(109,120,168,.6)}
.names .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.names .sc{font-weight:700;color:var(--star);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.names .pm{display:none;gap:2px}
.names li:hover .pm{display:flex}
.pm button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);font-size:14px;line-height:1;padding:0}
.top3{display:flex;flex-direction:column;gap:6px}
.top3 div{display:flex;align-items:center;gap:10px;font-weight:600}
.top3 .md{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--star-ink);flex:none}
.top3 .sc{margin-left:auto;color:var(--star)}
.lnk{background:none;border:0;color:var(--accent);font-weight:600;font-size:13.5px;padding:4px 0}

/* Kết quả */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(5,8,25,.72);backdrop-filter:blur(3px)}
.ov.show{display:flex}
.res{width:min(1100px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 24px);overflow-y:auto;border-radius:24px;border:1px solid var(--line);background:linear-gradient(180deg,#1b2560,#111944);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .35s both}
.res-head{text-align:center;padding:26px 20px 18px;position:relative;overflow:hidden;isolation:isolate}
.res-head::before{content:"";position:absolute;left:50%;top:55%;width:900px;height:900px;margin:-450px 0 0 -450px;z-index:-1;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,194,61,.16) 0 9deg,transparent 9deg 18deg);
  -webkit-mask:radial-gradient(closest-side,#000 15%,transparent 70%);mask:radial-gradient(closest-side,#000 15%,transparent 70%);animation:orbit 18s linear infinite}
.res-head .lbl{color:var(--star2);font-weight:700;letter-spacing:1.5px;font-size:14px;text-transform:uppercase;animation:pop .4s .1s both}
.res-head .who{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,min(8vw,11vh),96px);line-height:1.1;margin:6px 0 2px;filter:drop-shadow(0 4px 18px rgba(255,170,60,.4))}
.who .wd{display:inline-block;white-space:nowrap}
.who .ch{display:inline-block;background:linear-gradient(180deg,#fff7d6,#ffc23d 70%,#ff9f3d);-webkit-background-clip:text;background-clip:text;color:transparent;animation:chIn .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes chIn{from{opacity:0;transform:translateY(40px) scale(.3) rotate(-25deg)}}
.res-head .stars-now{color:var(--muted);font-weight:600}
.x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:20px}
.q{margin:0 20px 18px;padding:18px 20px;border-radius:18px;background:rgba(8,12,36,.55);border:1px solid var(--line);--qs:1}
.q-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:8px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:#26306a;color:#cfd6f5;font-weight:600}
.q-text{font-size:calc(22px * var(--qs));line-height:1.5;font-weight:600;white-space:pre-line}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#18215a;font-size:calc(19px * var(--qs))}
.opt .k{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font-weight:800;background:#2a3670;font-size:17px}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:rgba(79,209,143,.16)}
.opt.ok .k{background:var(--ok);color:#06301b}
.opt.no{border-color:var(--bad);background:rgba(255,123,114,.14)}
.opt.no .k{background:var(--bad);color:#3d0d09}
.ds{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ds-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#18215a;border:2px solid transparent;font-size:calc(18px * var(--qs))}
.ds-row .t{flex:1}
.ds-row.ok{border-color:var(--ok)}
.ds-row.no{border-color:var(--bad)}
.ds-row .tf{display:flex;gap:6px}
.ds-row .tf button{width:44px;height:38px;border-radius:10px;border:1px solid var(--line);background:#26306a;font-weight:800}
.ds-row .tf button[aria-pressed=true]{background:var(--accent);color:#0b1230;border-color:var(--accent)}
.ds-row .tf button.key{box-shadow:0 0 0 2px var(--ok)}
.ans{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(79,209,143,.1);border:1px solid rgba(79,209,143,.4);font-size:calc(17px * var(--qs));display:none}
.ans.show{display:block}
.ans b{color:var(--ok)}
.verdict{text-align:center;font-family:var(--f-display);font-size:28px;font-weight:800;margin-top:12px;display:none}
.verdict.show{display:block;animation:pop .3s both}
.res-foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 20px 22px}
.b{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:#1f2a66;font-weight:700;font-size:15px}
.b:hover{background:#28347a}
.b.ok{background:var(--ok);color:#06301b;border-color:transparent}
.b.bad{background:#5a2330;border-color:#7a3340}
.b.gold{background:linear-gradient(135deg,#ffe08a,#ffc23d);color:var(--star-ink);border-color:transparent}
.timer{position:absolute;top:14px;left:14px;width:58px;height:58px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:22px}
.timer.low b{color:var(--bad)}

/* Gọi nhiều ngôi sao: thẻ lật */
.mp-grid{position:absolute;inset:0;padding:16px;display:grid;gap:14px;overflow-y:auto;grid-template-columns:repeat(var(--c),minmax(0,1fr));grid-auto-rows:minmax(150px,1fr)}
.mp-card{position:relative;display:block;width:100%;height:100%;padding:0;border:0;background:none;perspective:1000px;container-type:size;cursor:default}
.mp-card{transition:transform .45s cubic-bezier(.3,1.2,.5,1),filter .25s;transition-delay:var(--dd,0s)}
.mp-card.up{cursor:pointer}
.mp-grid.gather{overflow:hidden}
.mp-grid.gather .mp-card{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.8)}
.mp-grid.riffle .mp-card{animation:mpRiffle .3s ease-in-out infinite;animation-delay:var(--dl)}
.mp-grid.dim .mp-card:not(.hot):not(.up){filter:brightness(.45)}
.mp-grid.dark .mp-card:not(.hot){filter:brightness(.3) saturate(.6)}
.mp-card.hot{z-index:3;transform:scale(1.07)}
.mp-card.hot .mp-back{border-color:var(--star);box-shadow:0 0 34px rgba(255,194,61,.75)}
.mp-card.roll .mp-back{animation:mpBuzz .09s linear infinite}
.mp-card.hit{animation:mpHit .55s cubic-bezier(.2,1.6,.4,1)}
.mp-back b.rolling{font-size:15px;font-size:clamp(14px,10cqmin,28px);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.mp-card.lucky .mp-front{border-color:#fff3c4;background:linear-gradient(135deg,#ffe08a,#ffc23d 45%,#ff9f3d);box-shadow:0 0 34px rgba(255,194,61,.8)}
.mp-card.lucky .mp-name{color:var(--star-ink)}
.mp-card.lucky .mp-meta,.mp-card.lucky .mp-meta em{color:#5a3c00}
.mp-card.lucky.seen .mp-front{border-color:#fff3c4;box-shadow:0 0 34px rgba(255,194,61,.8)}
.mp-banner{position:absolute;left:50%;top:18px;z-index:6;padding:8px 26px;border-radius:999px;border:2px solid var(--star);background:rgba(11,18,48,.94);color:var(--star2);font-family:var(--f-display);font-weight:800;font-size:clamp(18px,3vw,30px);white-space:nowrap;pointer-events:none;transform:translateX(-50%);box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 22px rgba(255,194,61,.4);animation:mpBanner .35s cubic-bezier(.2,1.5,.4,1) both}
.mp-banner[hidden],.chip[hidden]{display:none}
.mp-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.35,.5,1)}
.mp-card.up .mp-in{transform:rotateY(180deg)}
.mp-card.up:hover .mp-in{transform:rotateY(180deg) scale(1.03)}
.mp-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;overflow:hidden}
.mp-back{border:1px solid var(--line);background:radial-gradient(circle at 50% 35%,#2b3a8f,#121a3d 72%);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.mp-back b{font-family:var(--f-display);font-size:24px;font-size:clamp(18px,11cqmin,34px);color:var(--star2);line-height:1}
.mp-back svg{flex:0 1 auto;width:auto;height:66%;min-height:0;max-width:92%}
.mp-front{transform:rotateY(180deg);border:2px solid var(--star);background:linear-gradient(180deg,#2a2f7a,#151f4a);box-shadow:0 0 22px rgba(255,194,61,.35)}
.mp-card.seen .mp-front{border-color:var(--ok);box-shadow:0 0 14px rgba(79,209,143,.3)}
.mp-name{font-family:var(--f-display);font-weight:800;font-size:24px;font-size:clamp(17px,14cqmin,46px);line-height:1.15;color:var(--star2);overflow-wrap:anywhere}
.mp-meta{font-size:13.5px;font-weight:600;color:var(--muted)}
.mp-meta em{font-style:normal;color:var(--star);font-weight:700}
.mp-step{display:inline-flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.mp-step button{width:38px;height:38px;border:0;border-radius:50%;background:var(--panel2);font-size:20px;font-weight:700;line-height:1}
.mp-step button:hover:not(:disabled){background:#2b3a8f}
.mp-step button:disabled{opacity:.4;cursor:not-allowed}
.mp-step b{min-width:38px;text-align:center;font-family:var(--f-display);font-size:20px}
@keyframes mpRiffle{0%,100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.8)}50%{transform:translate(calc(var(--dx) + var(--jx)),calc(var(--dy) - 12px)) rotate(calc(var(--rot) * -1)) scale(.84)}}
@keyframes mpBuzz{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}
@keyframes mpHit{0%{transform:scale(1.07)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes mpBanner{from{opacity:0;transform:translateX(-50%) scale(.6)}}
@media (prefers-reduced-motion:reduce){.mp-grid.riffle .mp-card,.mp-card.roll .mp-back,.mp-card.hit{animation:none}.mp-in,.mp-card{transition-duration:.01s}}

/* Thiết lập */
.set{width:min(900px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 24px);display:flex;flex-direction:column;border-radius:22px;border:1px solid var(--line);background:#111944;overflow:hidden;animation:pop .25s both}
.set-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.set-head h2{margin:0 auto 0 4px;font-family:var(--f-display);font-size:22px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0;flex:none}
.tab{white-space:nowrap;padding:8px 14px;border-radius:10px 10px 0 0;border:1px solid transparent;background:none;color:var(--muted);font-weight:700}
.tab[aria-selected=true]{color:var(--ink);background:var(--panel2);border-color:var(--line);border-bottom-color:var(--panel2)}
.set-body{padding:16px;overflow-y:auto;border-top:1px solid var(--line);margin-top:-1px;background:var(--panel2);flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.inp{background:#0e1538;border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{width:100%;resize:vertical;line-height:1.5}
.muted{color:var(--muted);font-size:13.5px}
.chap{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#0e1538}
.chap summary{padding:10px 12px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center}
.chap summary .c{margin-left:auto;color:var(--muted);font-size:13px;font-weight:600}
.chap .ls{padding:0 12px 10px;display:flex;flex-direction:column;gap:2px}
.ck{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:14.5px;cursor:pointer}
.ck input{width:18px;height:18px;margin-top:2px;accent-color:var(--star);flex:none}
.ck .c{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}
.box{border:1px solid var(--line);border-radius:14px;background:#0e1538;padding:14px;margin-top:6px}
.box h3{margin:0 0 10px;font-family:var(--f-display);font-size:18px}
.stus{display:flex;flex-wrap:wrap;gap:6px}
.stu{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;border-radius:99px;background:#1f2a66;border:1px solid var(--line);font-weight:600;font-size:14.5px}
.stu.first{border-color:var(--star);background:rgba(255,194,61,.16)}
.stu i{font-style:normal;color:var(--muted);font-size:12px;font-weight:500}
.stu button{width:24px;height:24px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:17px;line-height:1;padding:0}
.stu button:hover{background:var(--bad);color:#3d0d09}
.qsl{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.qs{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:#0e1538}
.qs.on{border-color:rgba(255,194,61,.55)}
.qs-t{flex:1;min-width:0;display:flex;flex-direction:column}
.qs-t b{font-size:16px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:#18215a;margin-bottom:10px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--star);color:var(--star-ink)}
.frow{display:flex;align-items:center;gap:8px;margin-top:6px}
.frow .inp{flex:1;min-width:0}
.fk{width:38px;height:38px;flex:none;border-radius:10px;border:1px solid var(--line);background:#26306a;display:grid;place-items:center;font-weight:800}
.fk.on{background:var(--ok);color:#06301b;border-color:var(--ok)}
button.fk:hover{border-color:var(--ok)}
.tf2{display:flex;gap:4px}
.tf2 button{padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:#26306a;font-weight:700;font-size:13.5px}
.tf2 button[aria-pressed=true][data-v="1"]{background:var(--ok);color:#06301b;border-color:var(--ok)}
.tf2 button[aria-pressed=true][data-v="0"]{background:var(--bad);color:#3d0d09;border-color:var(--bad)}
.qitems{display:flex;flex-direction:column;gap:8px}
.qitem{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:#0e1538;border:1px solid var(--line)}
.qn{width:28px;height:28px;flex:none;border-radius:50%;background:#26306a;display:grid;place-items:center;font-weight:800;font-size:13px}
.qb{flex:1;min-width:0;font-weight:600;white-space:pre-line}
.qa{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-weight:500;font-size:14px;color:var(--muted)}
.qa .good{color:var(--ok);font-weight:700}
.qa .badc{color:#e3a29c}
.qitem .b{padding:6px 10px;font-size:13px}
.mbtn .eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px;width:0;overflow:hidden;transition:width .2s}
.mbtn.playing{background:linear-gradient(135deg,#ffe08a,#ffc23d);color:var(--star-ink);border-color:transparent}
.mbtn.playing .eq{width:14px}
.mbtn .eq i{display:block;width:3px;height:100%;background:currentColor;border-radius:2px;animation:eq .8s ease-in-out infinite alternate}
.mbtn .eq i:nth-child(2){animation-delay:-.3s}.mbtn .eq i:nth-child(3){animation-delay:-.55s}
@keyframes eq{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
.mbtn .eq i{transform-origin:bottom}
.mu{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:#0e1538;flex-wrap:wrap}
.mu.on{border-color:rgba(255,194,61,.55)}
.mu-t{flex:1;min-width:160px;display:flex;flex-direction:column}
.warn{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:rgba(255,194,61,.12);border:1px solid rgba(255,194,61,.45);color:#ffe08a;font-size:14px}
.prog{height:8px;border-radius:99px;background:#232e63;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--star));transition:width .2s}
.htbl{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.htbl table{width:100%;border-collapse:collapse;font-size:14px}
.htbl th{position:sticky;top:0;background:#1f2a66;text-align:left;padding:8px 10px;font-weight:700;white-space:nowrap}
.htbl td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
.htbl td.nw{white-space:nowrap}
.htbl td.qcell{min-width:180px}
.htbl td.good{color:var(--ok);font-weight:700}
.htbl td.badc{color:var(--bad);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:40;background:#fff;color:#111944;font-weight:700;padding:10px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:.25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
#fx{position:fixed;inset:0;z-index:30;pointer-events:none}

/* Màn hình thấp (laptop, máy chiếu 768px): thu gọn để vừa một khung, không phải cuộn */
@media (max-height:820px){
  .app{padding:8px 14px 10px;gap:8px}
  .brand .logo{width:36px;height:36px}
  .brand h1{font-size:22px}
  .ibtn{height:38px;min-width:38px}
  .mode{padding:6px 14px;font-size:14px}
  .mode .em{font-size:17px}
  .stage-foot{padding:8px}
  .go{font-size:22px;padding:6px 34px;box-shadow:0 4px 0 #b86f12,0 8px 20px rgba(255,170,60,.35)}
  .card{padding:10px 12px}
  .card h2{font-size:16px;margin-bottom:6px}
  .tg{padding:4px 0;font-size:14px}
  .tg small{display:none}
  .meter{margin:2px 0}
  .res-head{padding:16px 20px 10px}
  .q{margin:0 16px 12px;padding:12px 16px}
  .q-text{font-size:calc(20px * var(--qs))}
  .opts,.ds{margin-top:10px;gap:8px}
  .opt{padding:8px 12px}
  .res-foot{padding:0 16px 14px}
  .b{padding:8px 13px}
}
@media (max-height:600px){
  .brand h1 small,.hint{display:none}
  .top3 div:nth-child(n+4){display:none}
}
/* Tablet, điện thoại: khung trò chơi vừa phần màn hình còn lại, bảng bên nằm dưới */
@media (max-width:980px){
  .app{height:auto;min-height:100dvh}
  .top{flex-wrap:nowrap;gap:8px}
  .brand{min-width:0}
  .brand h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .main{grid-template-columns:1fr}
  .stage{height:var(--stage-h,calc(100dvh - 150px));min-height:300px}
  .side{overflow:visible}
  .side .card.grow{flex:none}
  .names{max-height:300px}
}
/* Điện thoại xoay ngang: hai cột, vừa đúng một màn hình */
@media (max-width:980px) and (orientation:landscape) and (max-height:560px){
  .app{height:100dvh;min-height:0;padding:6px 12px 8px;gap:6px}
  .main{grid-template-columns:minmax(0,1fr) 230px;gap:8px}
  .stage{height:auto;min-height:0}
  .side{overflow-y:auto}
  .side .card.grow{flex:1 1 120px}
  .names{max-height:none}
  .mode{padding:4px 12px}
  .stage-foot{padding:6px}
  .go{font-size:18px;padding:4px 24px}
}
@media (max-width:700px){
  .app{padding:8px 12px 12px;gap:8px}
  .top{gap:6px;flex-wrap:nowrap}
  .brand{min-width:0;gap:6px}
  .brand .logo{width:32px;height:32px}
  .brand h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand h1 small{display:none}
  .cls{padding:2px 4px 2px 8px}
  .cls label{display:none}
  .cls select{font-size:14px;max-width:96px}
  .ibtn{height:36px;min-width:36px;padding:0 8px}
  .ibtn .tx{display:none}
  .mbtn.playing .eq{width:14px}
  .modes{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .mode{padding:5px 11px;font-size:12.5px}
  .go{font-size:20px;padding:6px 28px}
  .hint{display:none}
  .opts{grid-template-columns:1fr}
  .q-text{font-size:calc(18px * var(--qs))}
  .opt{font-size:calc(16px * var(--qs))}
  .res-foot .b{flex:1 1 auto;justify-content:center}
  .tabs{gap:4px;padding:8px 10px 0}
  .tab{padding:6px 9px;font-size:13px;border-radius:9px 9px 0 0}
  .res-head{padding-top:44px}
  .timer{top:8px;left:10px;width:40px;height:40px}
  .timer b{font-size:16px}
  .x{top:8px;right:8px;width:34px;height:34px}
  .ov{padding:8px}
}

/* Chặng Đua Ngân Hà (Rally Mode) */
.rally-wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px 16px;overflow-y:auto;gap:10px}
.rally-hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(18,26,61,0.75);backdrop-filter:blur(8px);border:1px solid rgba(138,166,255,0.25);border-radius:14px;padding:8px 14px}
.rally-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:#fff}
.rally-title span.dot{width:8px;height:8px;border-radius:50%;background:#ffc23d;box-shadow:0 0 10px #ffc23d;animation:pulseDot 1.5s infinite alternate}
@keyframes pulseDot{0%{transform:scale(0.8);opacity:0.7}100%{transform:scale(1.2);opacity:1}}
.rally-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rally-tracks{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.rally-lane{background:rgba(18,26,61,0.65);border:1px solid rgba(138,166,255,0.2);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:12px;transition:all .2s ease;position:relative}
.rally-lane:hover{background:rgba(28,40,92,0.75);border-color:rgba(138,166,255,0.4)}
.rally-lane.winner{background:linear-gradient(135deg,rgba(255,194,61,0.25),rgba(18,26,61,0.85));border-color:#ffc23d;box-shadow:0 0 20px rgba(255,194,61,0.3)}
.rally-team-info{width:180px;flex-shrink:0;display:flex;flex-direction:column;gap:3px}
.rally-team-name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rally-team-members{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.rally-team-members:hover{color:#fff;text-decoration:underline}
.rally-team-btns{display:flex;gap:6px;margin-top:2px}
.rally-btn-step{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid #ffd45e;background:linear-gradient(135deg,#ffe08a,#ff9f3d);color:#121a3d;box-shadow:0 2px 8px rgba(255,170,60,0.3);transition:all .15s ease}
.rally-btn-step:hover{transform:scale(1.06);box-shadow:0 4px 12px rgba(255,170,60,0.5)}
.rally-btn-sub{padding:3px 8px;border-radius:999px;font-size:11px;color:var(--muted);background:transparent;border:1px solid rgba(255,255,255,0.18);cursor:pointer}
.rally-btn-sub:hover{color:#ff7b72;border-color:#ff7b72}

/* Đường đua & Trạm không gian */
.rally-track-lane{flex:1;position:relative;height:56px;display:flex;align-items:center;padding:0 24px}
.rally-rail{position:absolute;left:24px;right:24px;top:34px;height:6px;background:rgba(255,255,255,0.12);border-radius:4px;overflow:hidden}
.rally-rail-progress{height:100%;border-radius:4px;transition:width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)}
.rally-stations{position:absolute;left:24px;right:24px;top:31px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.rally-station{display:flex;flex-direction:column;align-items:center;gap:3px;transform:translateY(-5px)}
.rally-station-dot{width:16px;height:16px;border-radius:50%;background:rgba(18,26,61,0.95);border:2px solid rgba(138,166,255,0.4);display:flex;align-items:center;justify-content:center;font-size:9.5px;transition:all .2s;box-shadow:0 0 6px rgba(0,0,0,0.4)}
.rally-station.passed .rally-station-dot{background:var(--gold);border-color:#fff;box-shadow:0 0 10px var(--gold)}
.rally-station-lbl{font-size:9.5px;color:var(--muted);white-space:nowrap;margin-top:2px}

/* Phi thuyền không gian bay lượn trên đường ray */
.rally-ship{position:absolute;top:14px;transform:translate(-50%, -50%);font-size:26px;z-index:5;transition:left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);filter:drop-shadow(0 0 10px rgba(255,255,255,0.7));pointer-events:none}
.rally-ship-flame{position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:16px;height:9px;background:radial-gradient(circle, #ffe08a, #ff4757);border-radius:50% 0 0 50%;animation:flameFlicker .15s infinite alternate}
.rally-status-badge{width:88px;text-align:center;font-weight:700;font-size:12px;flex-shrink:0;padding:5px 6px;border-radius:8px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.12);color:#eef2ff}

/* Xúc xắc vũ trụ HUD Popup */
.rally-dice-modal{position:fixed;inset:0;background:rgba(11,18,48,0.7);backdrop-filter:blur(6px);z-index:9999;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.rally-dice-box{background:linear-gradient(135deg,rgba(21,31,74,0.95),rgba(11,18,48,0.95));border:2px solid var(--gold);box-shadow:0 0 35px rgba(255,194,61,0.45);border-radius:24px;padding:28px 36px;text-align:center;min-width:320px;max-width:90vw}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b8"/><stop offset=".6" stop-color="#ffc23d"/><stop offset="1" stop-color="#ff9f3d"/></linearGradient></defs><path fill="url(#lg)" d="M24 3l6.2 13.3 14.6 1.7-10.8 10 2.9 14.4L24 35.2 11.1 42.4 14 28 3.2 18l14.6-1.7z"/><circle cx="19" cy="22" r="2" fill="#3a2700"/><circle cx="29" cy="22" r="2" fill="#3a2700"/><path d="M19.5 27.5q4.5 4 9 0" stroke="#3a2700" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <h1>Gọi Tên Ngôi Sao<small>Chinh phục ngôi sao</small></h1>
    </div>
    <div class="cls"><label for="clsSel">Lớp</label><select id="clsSel"></select></div>
    <button class="ibtn" id="btnSet" title="Danh sách lớp & câu hỏi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h16"/><circle cx="17" cy="12" r="2.5"/></svg><span class="tx">Thiết lập</span></button>
    <button class="ibtn mbtn" id="btnMusic" title="Bật nhạc nền">♪ Nhạc</button>
    <button class="ibtn" id="btnSound" title="Bật/tắt âm thanh"></button>
    <button class="ibtn" id="btnFull" title="Toàn màn hình"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </header>

  <nav class="modes" id="modes"></nav>

  <div class="main">
    <section class="stage">
      <div class="stage-body" id="stageBody"></div>
      <div class="stage-foot" id="stageFoot"></div>
    </section>

    <aside class="side">
      <div class="card">
        <h2>Lượt gọi<span class="sp" id="leftTxt"></span></h2>
        <div class="meter"><i id="meter"></i></div>
        <label class="tg"><input type="checkbox" id="optNoRep"><span>Không gọi lại bạn đã được gọi<small>Hết lượt thì tự bắt đầu vòng mới</small></span></label>
        <label class="tg"><input type="checkbox" id="optAsk"><span>Kèm câu hỏi <span id="askInfo" class="muted"></span><small>Bạn được gọi trả lời một câu trong bộ câu hỏi</small></span></label>
        <label class="tg"><input type="checkbox" id="optNoRepQ"><span>Không lặp lại câu hỏi <span id="qLeftInfo" class="muted"></span><small>Dùng hết bộ câu hỏi thì tự bắt đầu lại</small></span></label>
        <label class="tg"><input type="checkbox" id="optSpeak"><span>Đọc to tên học sinh</span></label>
        <div style="display:flex;gap:14px;flex-wrap:wrap"><button class="lnk" id="btnQs">📚 Bộ câu hỏi</button><button class="lnk" id="btnReset">↺ Bắt đầu vòng gọi mới</button><button class="lnk" id="btnResetQ">↺ Làm mới câu hỏi</button></div>
      </div>
      <div class="card">
        <h2>🏆 Bảng ngôi sao</h2>
        <div class="top3" id="top3"></div>
      </div>
      <div class="card grow">
        <h2>Học sinh<span class="sp" id="cntTxt"></span><button class="lnk" id="btnAddStu" style="font-size:13.5px">+ Thêm</button></h2>
        <ul class="names" id="names"></ul>
      </div>
    </aside>
  </div>
</div>

<div class="ov" id="ovRes"><div class="res" id="res"></div></div>
<div class="ov" id="ovSet"><div class="set" id="set"></div></div>


<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var KEY = 'goi-ten-ngoi-sao-v1';
var MODES = [
  { id: 'wheel',   em: '🎡', name: 'Vòng Xoay Thiên Hà' },
  { id: 'race',    em: '🚀', name: 'Chiến Hạm Siêu Thanh' },
  { id: 'pig',     em: '🐷', name: 'Bắt Heo Sao Hỏa' },
  { id: 'sky',     em: '✨', name: 'Bầu Trời Tinh Vân' },
  { id: 'duck',    em: '🦆', name: 'Bắt Vịt Sân Đình' },
  { id: 'machine', em: '⚙️', name: 'Cỗ Máy Thời Gian' },
  { id: 'card',    em: '🃏', name: 'Mật Mã Định Mệnh' },
  { id: 'orb',     em: '🔮', name: 'Triệu Hồi Tinh Cầu' },
  { id: 'ufo',     em: '🛸', name: 'UFO Bí Ẩn' },
  { id: 'vortex',  em: '🌀', name: 'Hố Đen Lốc Xoáy' },

    if (q.t === 'mc' && /^[*-] /.test(line)) { if (line[0] === '*') q.a.push(q.c.length); q.c.push(line.slice(2).trim()); return; }
    if (q.t === 'ds' && /^[+-] /.test(line)) { q.a.push(line[0] === '+' ? 1 : 0); q.c.push(line.slice(2).trim()); return; }
    if (q.t === 'tl' && /^= /.test(line)) { q.a.push(line.slice(2).trim()); return; }
    if (!q.c.length && !q.a.length && line.trim()) q.q += (q.q ? '\n' : '') + line.trim();
  });

}
function qPool(){
  var all = [];
  S.qsets.forEach(function(s){ if (s.on) all = all.concat(parseCustom(s.text, s.name)); });

}
// Nhận diện câu hỏi theo nội dung (mỗi lần đọc bộ câu hỏi lại tạo đối tượng mới nên không so sánh trực tiếp được)
function qKey(q){
  var s = q.t + '|' + q.q + '|' + q.c.join('|'), h = 5381;
  for (var i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) >>> 0;
  return h.toString(36) + s.length.toString(36);
}
// Câu đã dùng được lưu riêng cho từng lớp, giữ nguyên khi tải lại trang
function qUsed(){ var id = cls().id; S.qUsed = S.qUsed || {}; return S.qUsed[id] || (S.qUsed[id] = []); }
function qLeft(){ var u = qUsed(), p = qPool(); return { left: p.filter(function(q){ return u.indexOf(qKey(q)) < 0; }).length, all: p.length }; }
var lastQKey = '', usedQ = []; // usedQ: biến cũ, còn được các nút sửa bộ câu hỏi gán lại; không còn dùng để chọn câu
function pickQ(){
  var p = qPool(); if (!p.length) return null;
  var fresh = p;
  if (S.set.noRepeatQ) {
    var u = qUsed();
    fresh = p.filter(function(q){ return u.indexOf(qKey(q)) < 0; });
    if (!fresh.length) { S.qUsed[cls().id] = []; fresh = p; toast('Đã dùng hết ' + p.length + ' câu hỏi — bắt đầu lại từ đầu.'); }
  }
  // tránh ra lại đúng câu vừa hỏi khi bắt đầu lại hoặc khi tắt chế độ không lặp lại
  if (fresh.length > 1) fresh = fresh.filter(function(q){ return qKey(q) !== lastQKey; });
  var q = fresh[rnd(fresh.length)]; lastQKey = qKey(q);
  if (S.set.noRepeatQ) { qUsed().push(lastQKey); save(); renderQLeft(); }
  return q;
}

function drawFestivalBunting(time) {
  const colors = ['#E63946', '#F4A261', '#E9C46A', '#2A9D8F', '#457B9D', '#9B5DE5'];
  const points = [
    { x: 120, y: 130 },
    { x: 380, y: 145 },
    { x: 640, y: 130 },
    { x: 900, y: 145 },
    { x: 1160, y: 130 }
  ];

  ctx.save();
  ctx.strokeStyle = 'rgba(100, 70, 40, 0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) {
    const prev = points[i - 1];
    const cur = points[i];
    const mx = (prev.x + cur.x) / 2;
    const my = Math.max(prev.y, cur.y) + 18;
    ctx.quadraticCurveTo(mx, my, cur.x, cur.y);
  }
  ctx.stroke();

  // Flags hanging along the rope
  const numFlags = 28;
  for (let i = 0; i < numFlags; i++) {
    const progress = (i + 0.5) / numFlags;
    const x = 140 + progress * 1000;
    const sag = Math.sin(progress * Math.PI * 4) * 12 + 140;
    const color = colors[i % colors.length];
    const flutter = Math.sin((time || 0) * 0.003 + i) * 3;

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x - 12, sag);
    ctx.lineTo(x + 12, sag);
    ctx.lineTo(x + flutter, sag + 24);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

  const hayGrad = ctx.createRadialGradient(x - r * 0.3, y - h * 0.2, 5, x, y, r * 1.3);
  hayGrad.addColorStop(0, '#FFE082');
  hayGrad.addColorStop(0.6, '#F1BF4A');
  hayGrad.addColorStop(1, '#C99326');

  ctx.fillStyle = hayGrad;
  ctx.beginPath();
  ctx.moveTo(x - r, y + h * 0.4);
  ctx.quadraticCurveTo(x - r * 0.9, y - h * 0.4, x, y - h * 0.6);
  ctx.quadraticCurveTo(x + r * 0.9, y - h * 0.4, x + r, y + h * 0.4);
  ctx.quadraticCurveTo(x, y + h * 0.55, x - r, y + h * 0.4);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#DCA334';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 7; i++) {

    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + 8, sy + 14);

}

  ctx.fillStyle = '#BA9868';
  ctx.beginPath();
  ctx.ellipse(ARENA.cx, ARENA.cy + 6, ARENA.rx + 16, ARENA.ry + 12, 0, 0, Math.PI * 2);
  ctx.fill();

  // Main sandy-clay arena ground gradient
  const groundGrad = ctx.createRadialGradient(
    ARENA.cx - 60,
    ARENA.cy - 40,
    40,
    ARENA.cx,
    ARENA.cy,
    ARENA.rx
  );
  groundGrad.addColorStop(0, '#F5DEB3');
  groundGrad.addColorStop(0.4, '#EBD2A2');
  groundGrad.addColorStop(0.8, '#D8BA87');
  groundGrad.addColorStop(1, '#C5A36F');

  ctx.fillStyle = groundGrad;
  ctx.beginPath();
  ctx.ellipse(ARENA.cx, ARENA.cy, ARENA.rx, ARENA.ry, 0, 0, Math.PI * 2);
  ctx.fill();

  // Subtle running track marks / dust swirls in dirt
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(ARENA.cx, ARENA.cy, ARENA.rx * 0.72, ARENA.ry * 0.68, 0, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();
}

function drawBambooFence(frontPass, time) {
  const totalPosts = 34;
  ctx.save();

  for (let i = 0; i < totalPosts; i++) {
    const angle = (i / totalPosts) * Math.PI * 2;
    const isFront = angle > 0 && angle < Math.PI;

    if (isFront !== frontPass) continue;

    const px = ARENA.cx + Math.cos(angle) * ARENA.rx;
    const py = ARENA.cy + Math.sin(angle) * ARENA.ry;

    if (frontPass && Math.abs(px - ARENA.cx) < ARENA.gateWidth * 0.52 && py > ARENA.cy + ARENA.ry * 0.75) {
      continue;
    }

    const scale = 0.75 + (py - (ARENA.cy - ARENA.ry)) / (ARENA.ry * 2) * 0.5;
    const postHeight = 52 * scale;
    const postWidth = 11 * scale;

    // Drop shadow
    ctx.fillStyle = 'rgba(60, 40, 20, 0.28)';
    ctx.beginPath();
    ctx.ellipse(px + 4 * scale, py + 2, postWidth * 0.9, postWidth * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();

    // Bamboo post with cylinder gradient
    const postGrad = ctx.createLinearGradient(px - postWidth / 2, 0, px + postWidth / 2, 0);
    postGrad.addColorStop(0, '#B38B4D');
    postGrad.addColorStop(0.35, '#DFC07F');
    postGrad.addColorStop(0.8, '#C49D58');
    postGrad.addColorStop(1, '#8A6329');

    ctx.fillStyle = postGrad;
    ctx.beginPath();
    ctx.roundRect(px - postWidth / 2, py - postHeight, postWidth, postHeight, 3);
    ctx.fill();

    // Bamboo nodes (Knots)
    ctx.strokeStyle = '#6A4716';
    ctx.lineWidth = 1.8 * scale;
    const nodeYs = [0.28, 0.62, 0.88];
    nodeYs.forEach(ny => {
      const yNode = py - postHeight + postHeight * ny;
      ctx.beginPath();
      ctx.moveTo(px - postWidth / 2 - 1, yNode);
      ctx.lineTo(px + postWidth / 2 + 1, yNode);
      ctx.stroke();
    });

    // Rope tie
    ctx.strokeStyle = '#523A1E';
    ctx.lineWidth = 2.2 * scale;
    ctx.beginPath();
    ctx.moveTo(px - postWidth / 2 - 1, py - postHeight * 0.65);
    ctx.lineTo(px + postWidth / 2 + 1, py - postHeight * 0.65 - 2);
    ctx.stroke();
  }

  // Horizontal bamboo rails
  const railsCount = 2;
  for (let r = 0; r < railsCount; r++) {
    const railHFrac = r === 0 ? 0.38 : 0.72;
    ctx.strokeStyle = '#C9A35F';
    ctx.lineWidth = frontPass ? 5.5 : 3.5;
    ctx.lineCap = 'round';

    ctx.beginPath();
    let started = false;
    const step = 0.04;
    const startAngle = frontPass ? 0.15 : Math.PI;
    const endAngle = frontPass ? Math.PI - 0.15 : Math.PI * 2;

    for (let a = startAngle; a <= endAngle; a += step) {
      const rx = ARENA.cx + Math.cos(a) * (ARENA.rx - 2);
      const ry = ARENA.cy + Math.sin(a) * (ARENA.ry - 2);

      if (frontPass && Math.abs(rx - ARENA.cx) < ARENA.gateWidth * 0.48 && ry > ARENA.cy + ARENA.ry * 0.75) {
        started = false;
        continue;
      }

      const scale = 0.75 + (ry - (ARENA.cy - ARENA.ry)) / (ARENA.ry * 2) * 0.5;
      const railY = ry - 52 * scale * railHFrac;

      if (!started) {
        ctx.moveTo(rx, railY);
        started = true;
      } else {
        ctx.lineTo(rx, railY);
      }
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(90, 60, 20, 0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  ctx.restore();
}

function drawEntranceGate(time) {
  const leftPostX = ARENA.cx - ARENA.gateWidth * 0.5;
  const rightPostX = ARENA.cx + ARENA.gateWidth * 0.5;
  const gy = ARENA.cy + ARENA.ry;

  ctx.save();

  [leftPostX, rightPostX].forEach((gx, idx) => {
    const pW = 18;
    const pH = 85;

    // Base shadow
    ctx.fillStyle = 'rgba(50, 30, 10, 0.35)';
    ctx.beginPath();
    ctx.ellipse(gx, gy + 4, 14, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wooden pillar
    const pGrad = ctx.createLinearGradient(gx - pW / 2, 0, gx + pW / 2, 0);
    pGrad.addColorStop(0, '#5A3416');
    pGrad.addColorStop(0.4, '#8E5A2D');
    pGrad.addColorStop(1, '#4A280F');

    ctx.fillStyle = pGrad;
    ctx.beginPath();
    ctx.roundRect(gx - pW / 2, gy - pH, pW, pH, 4);
    ctx.fill();

    // Top finial
    ctx.fillStyle = '#A36835';
    ctx.beginPath();
    ctx.arc(gx, gy - pH - 6, 9, 0, Math.PI * 2);
    ctx.fill();

    // Wooden door leaves swung open
    const doorAngle = idx === 0 ? -0.35 : 0.35;
    ctx.save();
    ctx.translate(gx, gy);
    ctx.rotate(doorAngle);

    const slatCount = 4;
    for (let s = 0; s < slatCount; s++) {
      const sx = (idx === 0 ? 1 : -1) * (s * 9 + 4);
      ctx.fillStyle = '#9C683B';
      ctx.fillRect(sx, -65, 7, 65);
      ctx.fillStyle = '#6E4522';
      ctx.fillRect(sx + 5, -65, 2, 65);
    }
    ctx.fillStyle = '#6B401D';
    ctx.fillRect((idx === 0 ? 4 : -38), -52, 36, 6);
    ctx.fillRect((idx === 0 ? 4 : -38), -20, 36, 6);

    ctx.restore();
  });

  // Sign banner above gate
  ctx.fillStyle = '#8B2616';
  ctx.beginPath();
  ctx.roundRect(ARENA.cx - 50, gy - 78, 100, 18, 4);
  ctx.fill();
  ctx.strokeStyle = '#F1C40F';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = '#FFF8E7';
  ctx.font = 'bold 9px "Be Vietnam Pro", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('CỔNG VÀO SÂN', ARENA.cx, gy - 69);

  ctx.restore();
}

function drawDuckEntity(duck, time) {
  const { x, y, dir, isTarget, hasGlasses, flapCycle } = duck;
  const direction = duck.direction || dir || 1;
  const walkCycle = duck.walkCycle || (flapCycle * 0.8);
  const wingAngle = Math.sin(flapCycle) * 0.4;

  ctx.save();
  ctx.translate(x, y);

  if (isTarget) {
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.45)';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.ellipse(0, 4, 26, 12, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Hop and soft shadow
  const hopY = Math.abs(Math.sin(walkCycle)) * 4;
  ctx.fillStyle = 'rgba(60, 40, 20, 0.22)';
  ctx.beginPath();
  ctx.ellipse(0, 6, 20 - hopY * 0.8, 9 - hopY * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.scale(direction, 1);
  ctx.translate(0, -hopY);
  if (duck.state === 'tugging') {
    ctx.rotate(-0.25);
  }

  // 1. Waddling orange webbed feet
  const leftFootOffset = Math.sin(walkCycle) * 6;
  const rightFootOffset = -Math.sin(walkCycle) * 6;

  ctx.fillStyle = '#FF7700';
  ctx.beginPath();
  ctx.ellipse(-6 + rightFootOffset, 4, 6, 3, 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(6 + leftFootOffset, 5, 7, 3.5, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // 2. Plump white-cream body
  const bodyGrad = ctx.createRadialGradient(-4, -14, 4, 0, -10, 22);
  bodyGrad.addColorStop(0, '#FFFFFF');
  bodyGrad.addColorStop(0.7, '#FFFBF0');
  bodyGrad.addColorStop(1, '#F3E8CD');

  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(-16, -14);
  ctx.quadraticCurveTo(-22, -18, -18, -10);
  ctx.quadraticCurveTo(-14, 0, 0, 2);
  ctx.quadraticCurveTo(16, 2, 16, -10);
  ctx.quadraticCurveTo(14, -22, 0, -22);
  ctx.quadraticCurveTo(-12, -22, -16, -14);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#EAD6B8';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // 3. Feathery wings
  ctx.save();
  ctx.translate(-2, -13);
  ctx.rotate(wingAngle * 0.8);

  const wingGrad = ctx.createLinearGradient(-10, 0, 10, 0);
  wingGrad.addColorStop(0, '#FAF6EC');
  wingGrad.addColorStop(1, '#FFFFFF');

  ctx.fillStyle = wingGrad;
  ctx.beginPath();
  ctx.moveTo(-6, -4);
  ctx.quadraticCurveTo(4, -10, 14, -4);
  ctx.quadraticCurveTo(12, 6, -2, 4);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#EAD6B8';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  // 4. Round head
  const headGrad = ctx.createRadialGradient(8, -26, 3, 8, -24, 16);
  headGrad.addColorStop(0, '#FFFFFF');
  headGrad.addColorStop(0.8, '#FFFBF0');
  headGrad.addColorStop(1, '#F0E3C7');

  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.arc(8, -24, 15, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#EAD6B8';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // 5. Pink blush cheek
  ctx.fillStyle = 'rgba(255, 130, 140, 0.4)';
  ctx.beginPath();
  ctx.ellipse(8, -20, 4.5, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // 6. Shiny black anime eye with dual sparkle
  ctx.fillStyle = '#1E1B18';
  ctx.beginPath();
  ctx.ellipse(12, -27, 3.5, 4.5, 0.1, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.arc(13.2, -28.5, 1.4, 0, Math.PI * 2);
  ctx.arc(11.2, -25.5, 0.8, 0, Math.PI * 2);
  ctx.fill();

  // Eyeglasses
  if (hasGlasses) {
    ctx.strokeStyle = '#1F2937';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(12, -27, 6.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(5.5, -27);
    ctx.lineTo(2, -26);
    ctx.stroke();
  }

  // 7. Bright orange beak
  const beakOpen = Math.sin((time || 0) * 0.015) > 0.3 ? 3 : 0;
  ctx.fillStyle = '#FF7A00';
  ctx.beginPath();
  ctx.moveTo(18, -26);
  ctx.quadraticCurveTo(28, -25, 27, -21 - beakOpen);
  ctx.quadraticCurveTo(22, -18, 17, -20);
  ctx.closePath();
  ctx.fill();

  if (beakOpen > 0) {
    ctx.fillStyle = '#D32F2F';
    ctx.beginPath();
    ctx.moveTo(18, -21);
    ctx.lineTo(25, -21);
    ctx.lineTo(19, -17);
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
}

function drawFarmerEntity(farmerObj, time) {
  const { x, y, walkCycle, ribbonWave, state, caught } = farmerObj;
  const direction = farmerObj.direction || farmerObj.dir || 1;

  ctx.save();
  ctx.translate(x, y);

  // Ground shadow
  const shadowW = state === 'lunge' ? 36 : 28;
  ctx.fillStyle = 'rgba(50, 30, 15, 0.28)';
  ctx.beginPath();
  ctx.ellipse(0, 4, shadowW, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.scale(direction, 1);

  let bodyTilt = 0;
  let bodyY = -34;
  let armReach = 18;

  if (state === 'chase') {
    bodyTilt = 0.22;
    armReach = 28;
  } else if (state === 'lunge') {
    bodyTilt = 0.42;
    armReach = 36;
    bodyY = -28;
  } else if (state === 'miss') {
    bodyTilt = -0.15;
    armReach = 14;
  } else if (state === 'rescue_tug') {
    bodyTilt = -0.25 + Math.sin((time || 0) * 0.02) * 0.1;
    armReach = 24;
    bodyY = -30;
  } else if (state === 'caught_hug' || state === 'carry' || caught) {
    bodyTilt = -0.05;
    armReach = 16;
  }

  ctx.rotate(bodyTilt);

  // 1. Bare feet
  const legSwing = Math.sin(walkCycle) * 12;
  ctx.fillStyle = '#F5C6A5';
  ctx.beginPath();
  ctx.ellipse(-10 - legSwing * 0.6, 2, 7, 4, 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(10 + legSwing * 0.6, 3, 8, 4.5, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // 2. Rolled-up dark trousers (Quần nâu xắn gấu)
  ctx.fillStyle = '#3E2A1E';
  ctx.beginPath();
  ctx.roundRect(-16 - legSwing * 0.4, -18, 12, 18, 3);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(4 + legSwing * 0.4, -18, 13, 19, 3);
  ctx.fill();

  // Cuff rolls
  ctx.fillStyle = '#5A3F2E';
  ctx.fillRect(-17 - legSwing * 0.4, -4, 14, 4);
  ctx.fillRect(3 + legSwing * 0.4, -3, 15, 4);

  // 3. Brown peasant tunic (Áo bà ba vải nâu)
  const shirtGrad = ctx.createLinearGradient(-16, bodyY, 16, bodyY);
  shirtGrad.addColorStop(0, '#6C4830');
  shirtGrad.addColorStop(0.5, '#8C6041');
  shirtGrad.addColorStop(1, '#5B3B24');

  ctx.fillStyle = shirtGrad;
  ctx.beginPath();
  ctx.roundRect(-18, bodyY, 36, 26, 6);
  ctx.fill();

  // Rope sash belt
  ctx.strokeStyle = '#EADDC7';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(-18, bodyY + 18);
  ctx.lineTo(18, bodyY + 18);
  ctx.stroke();

  ctx.fillStyle = '#EADDC7';
  ctx.fillRect(-6, bodyY + 18, 4, 9);
  ctx.fillRect(-1, bodyY + 18, 4, 11);

  // 4. Arms & Hands
  if (state === 'caught_hug' || state === 'carry' || caught) {
    // Wrapped arms holding caught duck against chest
    ctx.fillStyle = '#7A5237';
    ctx.beginPath();
    ctx.roundRect(-2, bodyY + 4, 26, 12, 5);
    ctx.fill();

    // MINI DUCK IN ARMS!
    ctx.save();
    ctx.translate(14, bodyY + 2);
    ctx.scale(0.85, 0.85);

    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 13, 0, 0, Math.PI * 2);
    ctx.fill();

    const miniFlap = Math.sin((time || 0) * 0.02) * 0.3;
    ctx.save();
    ctx.rotate(miniFlap);
    ctx.fillStyle = '#FFF8E7';
    ctx.beginPath();
    ctx.ellipse(-8, -6, 10, 5, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(8, -10, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(11, -12, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(12, -13, 1, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#FF7700';
    ctx.beginPath();
    ctx.moveTo(14, -11);
    ctx.lineTo(21, -8);
    ctx.lineTo(14, -5);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#FF7700';
    ctx.beginPath();
    ctx.ellipse(-2, 13, 5, 3.5, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(6, 14, 5, 3.5, -0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // Front arm forearm
    ctx.fillStyle = '#7A5237';
    ctx.beginPath();
    ctx.roundRect(8, bodyY + 6, 20, 10, 5);
    ctx.fill();
    ctx.fillStyle = '#F5C6A5';
    ctx.beginPath();
    ctx.ellipse(26, bodyY + 11, 5, 4, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (state === 'rescue_tug') {
    if (caught) {
      ctx.fillStyle = '#7A5237';
      ctx.beginPath();
      ctx.roundRect(-2, bodyY + 2, 26, 12, 5);
      ctx.fill();

      // Duck slipping in arms
      ctx.save();
      ctx.translate(14, bodyY);
      ctx.rotate(Math.sin((time || 0) * 0.03) * 0.15);
      ctx.scale(0.85, 0.85);

      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.ellipse(0, 0, 16, 13, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(8, -10, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(11, -12, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FF7700';
      ctx.beginPath();
      ctx.moveTo(14, -11);
      ctx.lineTo(22, -8);
      ctx.lineTo(14, -5);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#FF7700';
      ctx.beginPath();
      ctx.ellipse(-2, 16, 5, 4, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(6, 17, 5, 4, -0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      ctx.fillStyle = '#7A5237';
      ctx.beginPath();
      ctx.roundRect(8, bodyY + 4, 20, 10, 5);
      ctx.fill();
      ctx.fillStyle = '#F5C6A5';
      ctx.beginPath();
      ctx.ellipse(26, bodyY + 9, 5, 4, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#7A5237';
      ctx.beginPath();
      ctx.roundRect(-4, bodyY + 6, 26, 12, 4);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(10, bodyY + 10, 22, 11, 4);
      ctx.fill();
      ctx.fillStyle = '#F5C6A5';
      ctx.beginPath(); ctx.ellipse(22, bodyY + 16, 6, 5, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(32, bodyY + 18, 6, 5, 0.4, 0, Math.PI * 2); ctx.fill();
    }
  } else {
    // Reaching / feeling forward
    const handBob = Math.sin((time || 0) * 0.008) * 3;
    ctx.fillStyle = '#7A5237';
    ctx.beginPath();
    ctx.roundRect(2, bodyY + 4, armReach, 10, 4);
    ctx.fill();

    ctx.fillStyle = '#F5C6A5';
    ctx.beginPath();
    ctx.ellipse(armReach + 4, bodyY + 8 + handBob, 6, 5, 0.2, 0, Math.PI * 2);
    ctx.fill();

    for (let f = 0; f < 3; f++) {
      ctx.beginPath();
      ctx.ellipse(armReach + 8, bodyY + 6 + f * 3 + handBob, 3, 1.8, 0.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 5. Chibi Head & Cheeks
  const headY = bodyY - 14;
  const skinGrad = ctx.createRadialGradient(2, headY, 4, 0, headY, 18);
  skinGrad.addColorStop(0, '#FFE0C8');
  skinGrad.addColorStop(0.8, '#F5C6A5');
  skinGrad.addColorStop(1, '#E2AE8A');

  ctx.fillStyle = skinGrad;
  ctx.beginPath();
  ctx.arc(0, headY, 17, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(235, 100, 110, 0.45)';
  ctx.beginPath();
  ctx.arc(-8, headY + 5, 5, 0, Math.PI * 2);
  ctx.arc(8, headY + 5, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#8B2C24';
  if (state === 'miss') {
    ctx.beginPath();
    ctx.ellipse(0, headY + 9, 3.5, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(0, headY + 7, 4.5, 0, Math.PI, false);
    ctx.fill();
  }

  // 6. RED BLINDFOLD (Khăn đỏ bịt mắt)
  ctx.fillStyle = '#D62828';
  ctx.beginPath();
  ctx.roundRect(-18, headY - 6, 36, 11, 2);
  ctx.fill();

  ctx.fillStyle = '#FF595E';
  ctx.fillRect(-17, headY - 4, 34, 2);

  // Two fluttering red ribbon tails behind head
  const wave1 = Math.sin((time || 0) * 0.01 + (ribbonWave || 0)) * 8;
  const wave2 = Math.cos((time || 0) * 0.012 + (ribbonWave || 0)) * 10;

  ctx.fillStyle = '#D62828';
  ctx.beginPath();
  ctx.moveTo(-16, headY);
  ctx.quadraticCurveTo(-26, headY + wave1 * 0.5, -38, headY + wave1);
  ctx.lineTo(-37, headY + wave1 + 6);
  ctx.quadraticCurveTo(-25, headY + wave1 * 0.5 + 4, -16, headY + 4);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-16, headY - 2);
  ctx.quadraticCurveTo(-28, headY - 6 + wave2 * 0.5, -42, headY - 4 + wave2);
  ctx.lineTo(-41, headY + 2 + wave2);
  ctx.quadraticCurveTo(-27, headY - 2 + wave2 * 0.5, -16, headY + 2);
  ctx.closePath();
  ctx.fill();

  // 7. CONICAL LEAF HAT (Nón lá)
  const hatY = headY - 6;
  const hatWidth = 52;
  const hatHeight = 28;

  const hatGrad = ctx.createLinearGradient(0, hatY - hatHeight, 0, hatY);
  hatGrad.addColorStop(0, '#FFF2D1');
  hatGrad.addColorStop(0.4, '#F3DC9E');
  hatGrad.addColorStop(0.8, '#D8BC76');
  hatGrad.addColorStop(1, '#BBA15D');

  ctx.fillStyle = hatGrad;
  ctx.beginPath();
  ctx.moveTo(0, hatY - hatHeight);
  ctx.lineTo(hatWidth * 0.55, hatY);
  ctx.lineTo(-hatWidth * 0.55, hatY);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = 'rgba(120, 85, 30, 0.4)';
  ctx.lineWidth = 1.2;
  for (let r = 1; r <= 3; r++) {
    const ringFrac = r / 4;
    const ry = hatY - hatHeight + hatHeight * ringFrac;
    const rx = (hatWidth * 0.55) * ringFrac;
    ctx.beginPath();
    ctx.moveTo(-rx, ry);
    ctx.lineTo(rx, ry);
    ctx.stroke();
  }

  ctx.fillStyle = 'rgba(60, 40, 15, 0.35)';
  ctx.beginPath();
  ctx.ellipse(0, hatY + 1, hatWidth * 0.54, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawBatVitParticles(parts){ drawParticles(parts || particles); }
function drawParticles(parts) {
  parts.forEach(p => {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;

    if (p.type === 'dust') {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.type === 'sweat') {
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.size * 0.7, p.size * 1.3, 0.2, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.type === 'star') {
      ctx.font = `${p.size * 2}px sans-serif`;
      ctx.fillText('✨', p.x, p.y);
    }
    ctx.restore();
  });
}

function drawBatVitNameBadges(ducksList, farmerObj) {
  const visibleDucks = ducksList.filter(d => {
    if (farmerObj.caught && farmerObj.caught.id === d.id) return false;
    if (farmerObj.initialCaught && farmerObj.initialCaught.id === d.id && (gameState === 'CARRYING' || rescueTugStarted)) return false;
    if (saviorDuck && saviorDuck.id === d.id && (gameState === 'CARRYING' || rescueTugStarted)) return false;
    return true;
  });

  for (let i = 0; i < visibleDucks.length; i++) {
    for (let j = i + 1; j < visibleDucks.length; j++) {
      const d1 = visibleDucks[i];
      const d2 = visibleDucks[j];
      const dx = Math.abs(d1.x - d2.x);
      const dy = Math.abs((d1.y - 36 + (d1.labelOffsetY || 0)) - (d2.y - 36 + (d2.labelOffsetY || 0)));

      if (dx < 75 && dy < 24) {
        if (d1.y > d2.y) {
          d1.labelOffsetY = (d1.labelOffsetY || 0) + 2;
          d2.labelOffsetY = (d2.labelOffsetY || 0) - 2;
        } else {
          d1.labelOffsetY = (d1.labelOffsetY || 0) - 2;
          d2.labelOffsetY = (d2.labelOffsetY || 0) + 2;
        }
      }
    }
  }

  visibleDucks.forEach(duck => {
    duck.labelOffsetY = (duck.labelOffsetY || 0) * 0.9;
    const badgeY = duck.y - 38 + duck.labelOffsetY;

    ctx.save();
    ctx.font = 'bold 12px "Be Vietnam Pro", sans-serif';
    const textW = ctx.measureText(duck.name).width;
    const padX = 9;
    const badgeW = textW + padX * 2;
    const badgeH = 22;
    const bx = duck.x - badgeW / 2;
    const by = badgeY - badgeH / 2;

    if (Math.abs(duck.labelOffsetY) > 8) {
      ctx.strokeStyle = 'rgba(30, 58, 138, 0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(duck.x, duck.y - 28);
      ctx.lineTo(duck.x, badgeY + badgeH / 2);
      ctx.stroke();
    }

    // Shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.beginPath();
    ctx.roundRect(bx, by + 2, badgeW, badgeH, 11);
    ctx.fill();

    // Badge pill background
    ctx.fillStyle = duck.isTarget ? '#FFF9E6' : '#FFFFFF';
    ctx.beginPath();
    ctx.roundRect(bx, by, badgeW, badgeH, 11);
    ctx.fill();

    ctx.strokeStyle = duck.isTarget ? '#D97706' : '#2563EB';
    ctx.lineWidth = duck.isTarget ? 2 : 1.5;
    ctx.stroke();

    ctx.fillStyle = '#1E3A8A';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(duck.name, duck.x, badgeY);

    ctx.restore();
  });
}

function drawBatVitSpeechBubbles() {
  const activeBubbles = [];
  ducks.forEach(d => {
    if (d.speech && d.speechTimer > 0) {
      activeBubbles.push({
        x: d.x + ((d.dir || 1) === 1 ? 25 : -25),
        y: d.y - 48,
        text: d.speech,
        timer: d.speechTimer,
        isFarmer: false
      });
    }
  });

  if (farmer.speech && farmer.speechTimer > 0) {
    activeBubbles.push({
      x: farmer.x,
      y: farmer.y - 65,
      text: farmer.speech,
      timer: farmer.speechTimer,
      isFarmer: true
    });
  }

  activeBubbles.slice(0, 2).forEach(b => {
    const alpha = Math.min(1, b.timer / 0.3);
    ctx.save();
    ctx.globalAlpha = alpha;

    ctx.font = 'bold 12px "Be Vietnam Pro", sans-serif';
    const textW = ctx.measureText(b.text).width;
    const padX = 12;
    const bubbleW = textW + padX * 2;
    const bubbleH = 28;
    const bx = b.x - bubbleW / 2;
    const by = b.y - bubbleH;

    // Drop shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
    ctx.beginPath();
    ctx.roundRect(bx, by + 2, bubbleW, bubbleH, 14);
    ctx.fill();

    // Bubble background
    ctx.fillStyle = b.isFarmer ? '#FEF3C7' : '#FFFFFF';
    ctx.beginPath();
    ctx.roundRect(bx, by, bubbleW, bubbleH, 14);
    ctx.fill();

    // Pointer tail
    ctx.beginPath();
    ctx.moveTo(b.x - 6, by + bubbleH);
    ctx.lineTo(b.x, by + bubbleH + 7);
    ctx.lineTo(b.x + 6, by + bubbleH);
    ctx.closePath();
    ctx.fillStyle = b.isFarmer ? '#FEF3C7' : '#FFFFFF';
    ctx.fill();

    ctx.strokeStyle = b.isFarmer ? '#D97706' : '#2563EB';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    ctx.fillStyle = b.isFarmer ? '#92400E' : '#1E293B';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.text, b.x, by + bubbleH / 2);

    ctx.restore();
  });
}

function renderScene(time = performance.now()) {
  ctx.clearRect(0, 0, 1280, 720);

  // 1. Environmental Background (Sky, distant village, communal house, props)
  drawSkyAndHills(time);
  drawDinhLang(time);
  drawFestivalBunting(time);
  drawCourtyardProps(time);

  // 2. Dirt arena floor & Back half of bamboo fence (behind entities)
  drawArenaFloor();
  drawBambooFence(false, time);

  // 3. Collect renderables for 2.5D Y-Sorting
  const renderables = [];
  if (gameState !== 'RESULT') {
    renderables.push({ type: 'farmer', y: farmer.y, data: farmer });
  }

  ducks.forEach(d => {
    // If duck is carried in farmer's arms, farmer will draw the duck inside his arms!
    if (farmer.caught && farmer.caught.id === d.id && (gameState === 'CARRYING' || farmer.state === 'caught_hug')) {
      return;
    }
    renderables.push({ type: 'duck', y: d.y, data: d });
  });

  renderables.sort((a, b) => a.y - b.y);

  // 4. Render sorted entities
  renderables.forEach(item => {
    if (item.type === 'duck') {
      drawDuck(item.data, time);
    } else if (item.type === 'farmer') {
      drawFarmer(item.data, time);
    }
  });

  // 5. Front half of bamboo fence & Entrance gate (in front of entities)
  drawBambooFence(true, time);
  drawEntranceGate(time);

  // 6. Dust, sweat, and star particles
  drawParticles(particles);

  // 7. Student Name Badges with Anti-Overlap
  drawNameBadges(ducks, farmer);

  // 8. Speech Bubbles
  drawSpeechBubbles();

  // 9. Manual mode instruction banner
  if (mode === 'manual' && gameState === 'PLAYING') {
    ctx.save();
    ctx.fillStyle = 'rgba(30, 58, 138, 0.88)';
    ctx.beginPath();
    ctx.roundRect(440, 54, 400, 32, 10);
    ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 13px "Be Vietnam Pro", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🕹️ Dùng phím Mũi tên / WASD hoặc Nhấp chuột dẫn đường!', 640, 70);
    ctx.restore();
  }
}


// Main Game Update Loop
let lastTime = performance.now();


function addBatVitParticle(x, y, type, color){
  if (!particles) particles = [];
  particles.push({
    x: x, y: y,
    vx: (Math.random() - 0.5) * 80,
    vy: (Math.random() - 0.5) * 60 - 25,
    size: type === 'feather' ? 5 : type === 'dust' ? 4 : 6,
    color: color || '#FFF',
    life: 0.8 + Math.random() * 0.5,
    maxLife: 1.0,
    type: type,
    rot: Math.random() * 6.28,
    vrot: (Math.random() - 0.5) * 4
  });
}

function playDuckQuack(){
  tone(380 + Math.random() * 120, 0.08, 'sawtooth', 0.05);
  setTimeout(function(){
    tone(300 + Math.random() * 100, 0.12, 'sawtooth', 0.04);
  }, 45);
}

function buildDuck(P){
  var wrap = $('#duck'), cv = wrap.querySelector('canvas');
  var W = wrap.clientWidth, H = wrap.clientHeight;
  var x = fitCanvas(cv, W, H);

  gameState = 'IDLE';
  particles = [];

  farmer = {
    x: ARENA.cx,
    y: ARENA.cy + 10,
    vx: 0,
    vy: 0,
    dir: 1,
    direction: 1,
    walkCycle: 0,
    ribbonWave: 0,
    state: 'idle',
    caught: null,
    speech: '',
    speechTimer: 0
  };

  var DUCK_COLS = ['#F59E0B', '#FBBF24', '#FCD34D', '#F43F5E', '#10B981', '#3B82F6', '#8B5CF6'];

  ducks = P.map(function(name, i){
    var angle = (i / Math.max(1, P.length)) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
    var dist = 80 + Math.random() * (ARENA.rx - 140);
    return {
      id: 'd_' + i,
      name: name,
      studentName: name,
      x: ARENA.cx + Math.cos(angle) * (dist * 0.8),
      y: ARENA.cy + Math.sin(angle) * (dist * 0.5),
      vx: 0,
      vy: 0,
      dir: Math.random() > 0.5 ? 1 : -1,
      direction: 1,
      color: DUCK_COLS[i % DUCK_COLS.length],
      flapCycle: Math.random() * 10,
      wingAngle: 0,
      walkCycle: 0,
      hasGlasses: i % 4 === 1,
      labelOffsetY: 0,
      reactionEmoji: null,
      reactionTimer: 0,
      isTarget: false,
      speech: '',
      speechTimer: 0
    };
  });

  return {
    cv: cv, x: x, W: W, H: H, P: P,
    win: -1, running: false, t: 0
  };
}

function updateBatVitAI(dt, now){
  if (!duck) return;

  // Cập nhật hạt particles
  for (var pi = particles.length - 1; pi >= 0; pi--) {
    var p = particles[pi];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.vrot * dt;
    if (p.life <= 0) particles.splice(pi, 1);
  }

  // Cập nhật vịt
  ducks.forEach(function(d){
    if (gameState === 'PLAYING') {
      d.flapCycle += dt * 14;
      d.walkCycle += dt * 12;

      // Khoảng cách tới bác nông dân
      var dx = d.x - farmer.x, dy = d.y - farmer.y;
      var dist = Math.hypot(dx, dy);

      if (dist < 150) {
        // Hoảng sợ bỏ chạy
        var repel = (150 - dist) / 150 * 180;
        d.vx += (dx / dist) * repel * dt;
        d.vy += (dy / dist) * repel * dt;
        d.direction = d.vx > 0 ? 1 : -1;
        d.dir = d.direction;

        if (Math.random() < 0.15) addBatVitParticle(d.x, d.y + 4, 'dust', '#C9A35F');
        if (Math.random() < 0.08) addBatVitParticle(d.x, d.y - 10, 'feather', d.color);
        if (Math.random() < 0.015) playDuckQuack();

        // Nói ngẫu nhiên khi bị đuổi
        if (d.speechTimer <= 0 && Math.random() < 0.008) {
          var phrases = ['Quác quác!', 'Chạy mau!', 'Đừng bắt em!', 'Cứu tôi với!', 'Bắt bạn khác đi!'];
          d.speech = phrases[Math.floor(Math.random() * phrases.length)];
          d.speechTimer = 1.8;
        }
      }

      d.vx += (Math.random() - 0.5) * 50 * dt;
      d.vy += (Math.random() - 0.5) * 50 * dt;
      d.vx *= 0.94;
      d.vy *= 0.94;
      d.x += d.vx * dt;
      d.y += d.vy * dt;
    } else {
      // Đi dạo thư thả khi chưa bắt
      d.flapCycle += dt * 4;
      d.walkCycle += dt * 3;
      d.vx += (Math.random() - 0.5) * 15 * dt;
      d.vy += (Math.random() - 0.5) * 15 * dt;
      d.vx *= 0.92;
      d.vy *= 0.92;
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      if (Math.abs(d.vx) > 1) d.direction = d.vx > 0 ? 1 : -1;
    }

    if (d.speechTimer > 0) d.speechTimer -= dt;

    // Giữ vịt trong sân đình
    var nx = (d.x - ARENA.cx) / (ARENA.rx - 30);
    var ny = (d.y - ARENA.cy) / (ARENA.ry - 30);
    if (nx * nx + ny * ny > 1) {
      d.vx = -d.vx * 0.7;
      d.vy = -d.vy * 0.7;
      var ang = Math.atan2(d.y - ARENA.cy, d.x - ARENA.cx);
      d.x = ARENA.cx + Math.cos(ang) * (ARENA.rx - 32);
      d.y = ARENA.cy + Math.sin(ang) * (ARENA.ry - 32);
    }
  });

  // Cập nhật bác nông dân
  farmer.ribbonWave += dt * 5;
  if (farmer.speechTimer > 0) farmer.speechTimer -= dt;

  if (gameState === 'PLAYING') {
    farmer.walkCycle += dt * 10;
    var targetD = (duck.win >= 0) ? ducks[duck.win] : null;

    if (targetD) {
      var fdx = targetD.x - farmer.x;
      var fdy = targetD.y - farmer.y;
      var fdist = Math.hypot(fdx, fdy);

      farmer.direction = fdx > 0 ? 1 : -1;
      farmer.dir = farmer.direction;

      if (fdist > 40) {
        farmer.state = 'chase';
        farmer.x += (fdx / fdist) * 135 * dt;
        farmer.y += (fdy / fdist) * 135 * dt;
      } else {
        // Vồ bắt vịt!
        farmer.state = 'lunge';
        farmer.caught = targetD;
      }
    }
  } else if (gameState === 'CAUGHT') {
    farmer.state = 'caught_hug';
    farmer.walkCycle = 0;
    if (farmer.caught) {
      farmer.caught.x = farmer.x + farmer.direction * 12;
      farmer.caught.y = farmer.y - 25;
      farmer.caught.flapCycle += dt * 16;
    }
  }
}

function drawDuck(now, dt){
  if (!duck) return;
  var d = duck;
  var W = d.W, H = d.H;
  ctx = d.x;

  updateBatVitAI(dt, now);

  ctx.clearRect(0, 0, W, H);

  ctx.save();
  // Tự động căn chỉnh & co giãn khung cảnh 1280x720 vào giữa màn hình
  var scale = Math.min(W / 1280, H / 720);
  ctx.translate((W - 1280 * scale) / 2, (H - 720 * scale) / 2);
  ctx.scale(scale, scale);

  // 1. Trời xanh & đồi núi làng quê
  drawSkyAndHills(now);
  // 2. Mái đình ngói đỏ cong vút & cột gỗ lim
  drawDinhLang(now);
  // 3. Cờ ngũ sắc lễ hội
  drawFestivalBunting(now);
  // 4. Đống rơm vàng, vại nước, bụi chuối
  drawCourtyardProps(now);
  // 5. Mặt sân đình đất nện & gạch
  drawArenaFloor(now);
  // 6. Hàng rào tre làng (Back pass)
  drawBambooFence(false, now);

  // 7. Sắp xếp vịt và bác nông dân theo chiều sâu Y để vẽ đúng thứ tự trước sau
  var entities = [];
  ducks.forEach(function(dk){ entities.push({ type: 'duck', y: dk.y, obj: dk }); });
  entities.push({ type: 'farmer', y: farmer.y, obj: farmer });
  entities.sort(function(a, b){ return a.y - b.y; });

  entities.forEach(function(ent){
    if (ent.type === 'duck') {
      drawDuckEntity(ent.obj, now);
    } else {
      drawFarmerEntity(ent.obj, now);
    }
  });

  // 8. Hàng rào tre làng (Front pass)
  drawBambooFence(true, now);
  // 9. Cổng làng truyền thống
  drawEntranceGate(now);
  // 10. Lông vũ, bụi đất bay
  drawParticles(particles);
  // 11. Thẻ tên học sinh trên đầu vịt
  drawBatVitNameBadges(ducks, farmer);
  // 12. Bong bóng thoại vui nhộn
  drawBatVitSpeechBubbles();

  ctx.restore();
}

function runDuck(P, w){
  return new Promise(function(done){
    var d = duck;
    d.win = w;
    gameState = 'PLAYING';
    farmer.state = 'chase';
    farmer.caught = null;

    ducks.forEach(function(dk, i){
      dk.isTarget = (i === w);
      dk.speechTimer = 0;
    });

    playDuckQuack();
    farmer.speech = 'Đứng lại nào các chú vịt ơi!';
    farmer.speechTimer = 2.0;

    // Sau 2.8 giây rượt đuổi kịch tính, bác nông dân vồ trúng vịt
    setTimeout(function(){
      farmer.state = 'lunge';
      playDuckQuack();
      var targetD = ducks[w];
      addBatVitParticle(targetD.x, targetD.y, 'feather', '#F59E0B');
      addBatVitParticle(targetD.x, targetD.y, 'dust', '#C9A35F');

      setTimeout(function(){
        gameState = 'CAUGHT';
        farmer.state = 'caught_hug';
        farmer.caught = targetD;
        farmer.speech = 'Bắt được bạn ' + targetD.name + ' rồi!';
        farmer.speechTimer = 3.0;

        playDuckQuack();
        tone(523, 0.2, 'triangle', 0.1);
        tone(659, 0.2, 'triangle', 0.1, 0.1);
        tone(784, 0.4, 'triangle', 0.1, 0.2);
        FX(150, d.W / 2, d.H * 0.55);

        setTimeout(done, 1100);
      }, 500);
    }, 2800);
  });
}

/* ---------------- 2. CỖ MÁY KỲ DIỆU (MACHINE) ---------------- */
function buildMachine(P){
  var wrap = $('#machine'), cv = wrap.querySelector('canvas'), W = wrap.clientWidth, H = wrap.clientHeight;
  var x = fitCanvas(cv, W, H);
  return { cv: cv, x: x, W: W, H: H, P: P, offset: 0, speed: 0, gearRot: 0, win: -1, running: false };
}
function drawMachine(now, dt){
  if (!machine) return;
  var m = machine, x = m.x, W = m.W, H = m.H;
  x.clearRect(0, 0, W, H);
  m.gearRot += dt * (m.running ? 6 : 1);
  m.offset += m.speed * dt;
  // Khung máy công nghệ vũ trụ Steampunk
  var mw = Math.min(W - 40, 560), mh = Math.min(H - 40, 360);
  var mx = (W - mw)/2, my = (H - mh)/2;
  // Bánh răng trang trí 4 góc
  function drawCog(cx, cy, r, rot){
    x.save(); x.translate(cx, cy); x.rotate(rot);
    x.fillStyle = '#ffc23d'; x.strokeStyle = '#3a2700'; x.lineWidth = 2;
    for (var k = 0; k < 8; k++){
      x.rotate(Math.PI / 4);
      x.fillRect(-r*.2, -r, r*.4, r*2);
    }
    x.beginPath(); x.arc(0, 0, r*.75, 0, 6.28); x.fill(); x.stroke();
    x.fillStyle = '#121a3d'; x.beginPath(); x.arc(0, 0, r*.3, 0, 6.28); x.fill(); x.stroke();
    x.restore();
  }
  drawCog(mx + 20, my + 20, 32, m.gearRot);
  drawCog(mx + mw - 20, my + 20, 26, -m.gearRot * 1.2);
  drawCog(mx + 20, my + mh - 20, 24, -m.gearRot * 1.4);
  drawCog(mx + mw - 20, my + mh - 20, 30, m.gearRot);
  // Khung viền kim loại chính
  x.fillStyle = '#121a3d'; x.strokeStyle = '#2a3670'; x.lineWidth = 3;
  x.beginPath();
  if (x.roundRect) x.roundRect(mx, my, mw, mh, 20); else x.rect(mx, my, mw, mh);
  x.fill(); x.stroke();
  // Vành vàng phát sáng
  x.strokeStyle = '#ffc23d'; x.lineWidth = 1.5;
  x.beginPath();
  if (x.roundRect) x.roundRect(mx + 6, my + 6, mw - 12, mh - 12, 16); else x.rect(mx + 6, my + 6, mw - 12, mh - 12);
  x.stroke();
  // Màn hình cuốn tên
  var scrW = mw - 80, scrH = 120, scrX = mx + 40, scrY = my + (mh - scrH)/2;
  x.fillStyle = '#080d24'; x.strokeStyle = '#ffc23d'; x.lineWidth = 2;
  x.fillRect(scrX, scrY, scrW, scrH); x.strokeRect(scrX, scrY, scrW, scrH);
  // Tên cuộn
  x.save();
  x.beginPath(); x.rect(scrX, scrY, scrW, scrH); x.clip();
  var rowH = 46, n = m.P.length;
  var fs = Math.max(16, Math.min(26, scrW / 14));
  x.font = '800 ' + fs + 'px "Be Vietnam Pro",sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  for (var i = -2; i <= 3; i++){
    var idx = Math.floor((m.offset / rowH + i) % n);
    if (idx < 0) idx += n;
    var name = m.P[idx];
    var py = scrY + scrH/2 + i * rowH - (m.offset % rowH);
    var distCenter = Math.abs(py - (scrY + scrH/2));
